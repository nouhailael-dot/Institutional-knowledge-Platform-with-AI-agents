            {
              "fixture://climate_week/event-search": "tests/fixtures/agents/climate_week_event_search.html",
            },
          "llm_fixture_response": "tests/fixtures/agents/climate_week_events.expected.json",
          "pagination_urls": [],
          "event_row_batch_size": 25,
          "min_event_row_count": 400,
          "diagnostics":
