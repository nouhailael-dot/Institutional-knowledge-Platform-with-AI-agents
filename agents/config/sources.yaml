            },
          "rate_limit_s": 1.0,
          "timeout_s": 20.0,
          "max_retries": 3,
          "user_agent_product": "GHUS-AgentDiscovery/0.1",
          "contact_email_env": "GHUS_AGENT_CONTACT_EMAIL",
          "claude_model": "claude-sonnet-5",
          "llm_pricing":
