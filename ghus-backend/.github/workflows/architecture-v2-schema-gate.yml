name: Architecture V2 schema gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-gate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/architecture-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse merge while schema gate is unmet
        run: python scripts/check_architecture_v2_schema_gate.py
