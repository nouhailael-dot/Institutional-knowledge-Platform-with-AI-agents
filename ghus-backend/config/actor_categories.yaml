# Actor categories and category types — the Intern Guide catalog.
#
# Source of truth: "Actor Mapping: Categories, Category Types, and Link Types"
# (Actor Categories and Link Types — Intern Guide). Display labels are final and
# must match that document's wording exactly, normalised to Title Case: every
# principal word is capitalised, including after a hyphen or a slash, while the
# short function words (a, and, by, for, in, of, or, the, to, with) stay lower
# case unless they come first. Acronyms stay upper case.
#
# Category codes are the stable Phase 5 codes and never change: canonical rows,
# the hub algorithm, config/architecture_v2.yaml and Agent 3 all key on them.
# Only the display labels changed. Type codes are reused wherever the Guide type
# means the same thing in the same category, so an already-classified record
# keeps its stored value. A Guide type that is genuinely new, or that belongs to
# a different category than its Phase 5 near-equivalent, gets a new code; the
# superseded Phase 5 code is retired (active = false), never deleted.
#
# Every category ends with Not Applicable. It is a deliberate reviewer choice —
# never a stand-in for missing data — and always requires a one-line note plus a
# category_doubt review item.
version: intern-guide-2026-10
categories:
  - code: university_academic
    label: "University / Academic Institution"
    definition: >-
      A degree-granting institution, or any formal unit organizationally part of
      one, including research labs and accelerators run by the university itself.
    types:
      - code: university_system
        label: "Main Institution"
        meaning: "The university record itself — the top of its own tree"
      - code: academic_department
        label: "Department"
        meaning: "An academic subject-area unit (e.g. Dept. of Plant Sciences)"
      - code: college_school
        label: "College / School"
        meaning: "A larger academic division containing multiple departments"
      - code: research_lab_center
        label: "Research Lab / Center"
        meaning: "A research-focused unit inside the university, not its own degree program"
      - code: tech_transfer_office
        label: "Tech Transfer Office"
        meaning: "Patenting and licensing of university research, not startup support"
      - code: professional_executive_education
        label: "Professional / Executive Education"
        meaning: "Non-degree executive education, certificates and short courses"
      - code: accelerator_incubator
        label: "Accelerator / Incubator"
        meaning: "A university-run startup-support program"
      - code: medical_school
        label: "Medical School"
        meaning: "The degree-granting medical academic unit; the clinical hospital is a separate Category 5 record"
      - code: applied_facility_testbed_field_site
        label: "Applied Facility / Testbed / Field Site"
        meaning: "A university-run physical test or demonstration site, such as a farm or pilot plant"
      - code: extension_outreach_program
        label: "Extension / Outreach Program"
        meaning: "A public or community-facing applied program, such as agricultural extension"
      - code: not_applicable
        label: "Not Applicable"
        meaning: "The university itself with no further sub-unit detail needed, or nothing listed fits"
  - code: research_center
    label: "Research Center / Institute / Laboratory"
    definition: >-
      Independent research organizations only. A university research lab is
      Category 1, not here.
    types:
      - code: independent_institute
        label: "Independent"
        meaning: "Freestanding, with no parent organization of any kind"
      - code: nonprofit_operated
        label: "Nonprofit-Operated"
        meaning: "Run by a nonprofit entity as its primary vehicle"
      - code: corporate_operated
        label: "Corporate-Operated"
        meaning: "Run by or embedded in a company"
      - code: government_affiliated
        label: "Government-Affiliated"
        meaning: "Government-funded, policy-focused or agency-housed, but not formally designated as a national laboratory"
      - code: not_applicable
        label: "Not Applicable"
        meaning: "Nothing listed fits yet"
  - code: national_laboratory
    label: "National Laboratory"
    definition: >-
      Always its own category, regardless of who operates it. Requires formal
      designation: on the NSF FFRDC master list, or chartered as a national lab
      by its sponsoring agency, under a formal management contract. Federal
      grants, agency housing or government-relevant research do not qualify on
      their own; those are Category 2 with type Government-Affiliated.
    types:
      - code: university_operated_affiliated
        label: "University-Operated / Affiliated"
        meaning: "Formally designated national lab whose operating contract is held by a university, such as Lawrence Berkeley National Lab and UC Berkeley"
      - code: corporate_operated
        label: "Corporate-Operated"
        meaning: "Operating contract held by a company, such as Sandia National Laboratories"
      - code: consortium_operated
        label: "Consortium-Operated"
        meaning: "Operating contract held by a multi-institution consortium, such as Fermilab"
      - code: government_direct
        label: "Government-Direct"
        meaning: "Run directly by the federal agency with no outside operating contractor, such as NIST"
      - code: not_applicable
        label: "Not Applicable"
        meaning: "Nothing listed fits yet"
  - code: applied_facility
    label: "Applied Research Facility / Testbed / Field Site"
    definition: >-
      Independent facilities only. A university-run testbed is Category 1 with
      type Applied Facility / Testbed / Field Site.
    types:
      - code: independent
        label: "Independent"
        meaning: "No parent organization"
      - code: government_operated
        label: "Government-Operated"
        meaning: "Run by a federal, state or local agency"
      - code: corporate_operated
        label: "Corporate-Operated"
        meaning: "Run by a company"
      - code: nonprofit_operated
        label: "Nonprofit-Operated"
        meaning: "Run by a nonprofit"
      - code: not_applicable
        label: "Not Applicable"
        meaning: "Nothing listed fits yet"
  - code: hospital_clinical
    label: "Hospital / Clinical System / Medical Center"
    definition: >-
      Always its own category, university-affiliated or not. A GHUS filter for
      all hospitals must surface academic medical centers too, so they are never
      nested under University.
    types:
      - code: independent_standalone
        label: "Independent-Standalone"
        meaning: "No parent system or institution"
      - code: nonprofit_health_system
        label: "Nonprofit Health System"
        meaning: "Part of a larger nonprofit hospital network"
      - code: for_profit_health_system
        label: "For-Profit Health System"
        meaning: "Part of a larger for-profit hospital network"
      - code: public_government_hospital
        label: "Public or Government Hospital"
        meaning: "Operated by a government entity"
      - code: academic_medical_center
        label: "University-Affiliated"
        meaning: "Operated by, or formally tied to, a university medical school; the medical school itself is a separate Category 1 record"
      - code: not_applicable
        label: "Not Applicable"
        meaning: "Nothing listed fits yet"
  - code: company
    label: "Company / Corporate Actor"
    definition: Established commercial or industrial company, or business unit.
    types:
      - code: public_company
        label: "Public Company"
        meaning: "Publicly traded"
      - code: private_company
        label: "Private Company"
        meaning: "Privately held, not SME-scale"
      - code: small_mid_size
        label: "SME"
        meaning: "Small or medium enterprise, privately held"
      - code: business_unit_subsidiary
        label: "Subsidiary / Business Unit"
        meaning: "A unit of a larger parent company"
      - code: joint_venture
        label: "Joint Venture"
        meaning: "Jointly owned by two or more companies"
      - code: not_applicable
        label: "Not Applicable"
        meaning: "Nothing listed fits yet"
  - code: startup
    label: "Startup / Emerging Technology Company"
    definition: Judge by development and commercialization stage, not age.
    types:
      - code: independent_startup
        label: "Independent"
        meaning: "Founded and operating with no institutional origin tie"
      - code: university_spinout
        label: "University Spinout"
        meaning: "Founded on university-originated IP or research"
      - code: corporate_spinout
        label: "Corporate Spinout"
        meaning: "Spun out of a company"
      - code: accelerator_portfolio_company
        label: "Accelerator Portfolio Company"
        meaning: "Currently or recently in an accelerator or incubator program"
      - code: not_applicable
        label: "Not Applicable"
        meaning: "Nothing listed fits yet"
  - code: innovation_platform
    label: "Innovation & Entrepreneurship (E&I) Platform"
    definition: >-
      Not under a university: a university-run accelerator or incubator is
      Category 1 with type Accelerator / Incubator. The operator — independent,
      corporate, government or nonprofit — is recorded in the Description, not
      as a category type. Quick test: does the actor operate the programs or
      space itself? Category 8. Does it convene a membership of organizations
      that each run their own thing? Category 12.
    types:
      - code: incubator
        label: "Incubator"
        meaning: "Provides space and resources for early-stage companies over an open-ended term"
      - code: accelerator
        label: "Accelerator"
        meaning: "Runs fixed-term, cohort-based startup programs"
      - code: venture_studio
        label: "Venture Studio"
        meaning: "Builds and launches new ventures itself rather than supporting external founders"
      - code: not_applicable
        label: "Not Applicable"
        meaning: "Nothing listed fits yet"
  - code: investor
    label: "Investor / Funding Platform"
    definition: Organization that manages or deploys investment capital.
    types:
      - code: venture_capital
        label: "Venture Capital Firm"
        meaning: "Institutional VC investing from managed funds"
      - code: corporate_venture
        label: "Corporate Venture Arm"
        meaning: "A company's internal investment arm"
      - code: public_investment_fund
        label: "Government Fund"
        meaning: "Public-sector investment vehicle"
      - code: angel_group
        label: "Family Office / Angel Network"
        meaning: "Private individual or family capital, or an organized angel group"
      - code: not_applicable
        label: "Not Applicable"
        meaning: "Nothing listed fits yet"
  - code: government
    label: "Government Agency / Public Authority"
    definition: Public-sector body with a government mandate.
    types:
      - code: federal_agency
        label: "Federal"
        meaning: "National-level agency"
      - code: state_agency
        label: "State"
        meaning: "State-level agency"
      - code: local_municipal
        label: "Local / Municipal"
        meaning: "City or county-level agency"
      - code: public_utility
        label: "Public Utility"
        meaning: "Government-affiliated utility provider"
      - code: not_applicable
        label: "Not Applicable"
        meaning: "Nothing listed fits yet"
  - code: foundation_nonprofit
    label: "Foundation / Nonprofit"
    definition: Mission-driven nonprofit, including grant makers.
    types:
      - code: private_foundation
        label: "Private Foundation"
        meaning: "Privately endowed, typically grant-making"
      - code: operating_nonprofit
        label: "Operating Nonprofit"
        meaning: "Runs its own programs rather than primarily granting funds"
      - code: corporate_foundation
        label: "Corporate Foundation"
        meaning: "A company's affiliated philanthropic arm"
      - code: community_foundation
        label: "Community Foundation"
        meaning: "Pools local or regional donor funds for local grantmaking"
      - code: not_applicable
        label: "Not Applicable"
        meaning: "Nothing listed fits yet"
  - code: association_network
    label: "Association / Consortium / Network"
    definition: >-
      A membership body connecting several independent organizations. It
      convenes members; it does not operate programs itself the way an E&I
      Platform does.
    types:
      - code: trade_association
        label: "Trade Association"
        meaning: "Represents a commercial industry's shared interests"
      - code: research_consortium
        label: "Research Consortium"
        meaning: "Multi-member group organized around shared research; each member links in as Member of, never as parent or child"
      - code: innovation_consortium
        label: "Innovation Consortium"
        meaning: "Multi-member group organized around innovation or commercialization themes rather than research"
      - code: multi_location_network
        label: "Statewide / Multi-Location Network"
        meaning: "One parent record, with each individual physical location mapped as its own linked child actor"
      - code: professional_network
        label: "Professional Network"
        meaning: "Organized around a shared profession or role, not research or innovation"
      - code: diaspora_network
        label: "Diaspora Network"
        meaning: "Organized around shared national or regional origin, such as a Morocco or Africa diaspora professional network"
      - code: not_applicable
        label: "Not Applicable"
        meaning: "Nothing listed fits yet"
