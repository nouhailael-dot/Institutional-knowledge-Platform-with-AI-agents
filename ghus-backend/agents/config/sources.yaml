  "open_web_discovery":
    {
      "provider": "claude",
      "brave_api_key_env": "BRAVE_SEARCH_API_KEY",
      "web_search_tool_version": "web_search_20250305",
      "web_search_usd_per_request": 0.01,
      "web_search_max_uses": 1,
      "results_per_query": 10,
      "triage_batch_size": 8,
      # 2026-10-15: 4 per call meant 30 Sonnet calls (~$0.30) per request run,
      # each repeating the same instructions. 20 per call: 6 calls.
      "actor_triage_batch_size": 20,
      "event_triage_batch_size": 8,
      "person_triage_batch_size": 8,
      "triage_max_tokens": 8000,
      "max_searches": 52,
      "actor_query_limit": 40,
      # A Discovery-page request searches one topic in one area. 16, not 24
      # (2026-10-15): each search costs ~$0.022 and on the Oct-14 run 15 of 24
      # queries returned nothing worth reading; names in every result are now
      # harvested as leads, so fewer searches go further.
      "request_query_limit": 16,
      "actor_max_searches": 52,
      "max_candidates_triaged": 200,
      "fetch_enabled": true,
      "fetch_fit_floor": { "event": 0.60 },
      # 2026-10-29: 40 / 40 cut a request run short ("max_pages_fetched cap
      # hit: 43 eligible, 40 selected"); 80 leaves room for a full run.
      "max_pages_fetched": 80,
      "max_new_domains": 80,
      "raw_storage_dir": "agents/raw_documents",
      "rate_limit_s": 1.0,
      "timeout_s": 20.0,
      "max_retries": 2,
      "max_redirects": 5,
      "user_agent_product": "GHUS-AgentDiscovery/0.1",
      "contact_email_env": "GHUS_AGENT_CONTACT_EMAIL",
      "extraction_model": "claude-sonnet-5",
      "extraction_max_tokens": 2048,
      "extraction_llm_pricing":
        { "input_usd_per_million": 2.0, "output_usd_per_million": 10.0 },
      # Light Pull for kept candidates and existing actors (agents/collection/
      # light_pull_candidates.py): home + About + one topic page, one Sonnet call
      # per organisation. Its own cap, separate from the discovery budget;
      # 1.00 (GHUS, 2026-10-29) covers about 20 kept organisations at ~$0.05.
      "light_pull_model": "claude-sonnet-5",
      "light_pull_max_usd_per_run": 1.00,
      # Actor updates (agents/collection/actor_updates.py): one Light Refresh
      # of an actor already on the map. The freshness windows decide which
      # boxes a "missing" or "outdated" update re-reads; values pending GHUS
      # sign-off, so they live here rather than in code.
      # 2026-10-29: each actor now also gets a Category Type proposal when it
      # has none, and may need a fallback search; the per-actor cap doubles
      # (past reads cost $0.02-$0.13) and a request may cover 20 actors,
      # within $3.00 a run (GHUS, 2026-10-29).
      "actor_updates":
        {
          "max_usd_per_actor": 0.30,
          "max_actors_per_request": 20,
          "max_usd_per_request_run": 3.00,
          "stale_after_days": 365,
          "time_sensitive_stale_after_days": 180,
          "recheck_not_found_after_days": 90,
          "check_valid_hours": 24,
          # When an organisation's own site refuses the agent (403, 429, robots,
          # timeout): its parent's official pages that name it, free; then at
          # most this many paid web searches, inside max_usd_per_actor.
          "fallback_web_searches": 2,
        },
      "actor_rubric_max_tokens": 4096,
      "actor_rubric_content_max_chars": 8000,
      # Rerank only reordered the review list (~$0.08 a run). Engagement
      # priority now orders it at no cost.
      "actor_rerank_enabled": false,
      # Classify only pages that are kept (a second model call per page).
      "actor_lazy_classification": true,
      # Strict budget per requested run, stopped gracefully (see phase2).
      # 2026-10-29: $1.00 stopped request runs mid-way ("agent run cost
      # $1.0132 exceeded ceiling $1.0000"); $3.00 lets one finish.
      "request_max_usd_per_run": 3.00,
      "actor_est_page_usd": 0.03,
      "actor_budget_reserve_usd": 0.05,
      # Official-site reads and leads (agents/discovery/search/actor_official.py).
      "actor_max_official_followups": 8,
      "actor_followup_min_score": 0.60,
      "actor_max_leads_per_run": 20,
      "actor_lead_model": "claude-haiku-4-5",
      "actor_lead_llm_pricing":
        { "input_usd_per_million": 1.0, "output_usd_per_million": 5.0 },
      "actor_rerank_max_tokens": 2048,
      "actor_rerank_top_n": 40,
      "actor_rerank_group_size": 10,
      # Recalibrated October 2026 on 95 rubric-scored candidates (median 0.53,
      # p75 0.72). 0.30 / 0.70 auto-accepted 29% of everything scored, including
      # third-party pages and directories; 0.45 / 0.80 (0.85 until 2026-10-15) plus the actor_quality
      # gates below accepts 5% and rejects 27%. "Accept" means created as
      # Parked with a verify_actor review item - never Verified.
      "actor_score_thresholds": { "auto_low": 0.45, "auto_high": 0.80 },
      # Hard gates applied on top of the score. See actor_quality.py.
      # accept_min_priority: verifying WITHOUT a person also needs engagement
      # priority >= this (relevance alone would verify 30% unseen; see
      # actor_quality.QualityConfig).
      "actor_quality":
        { "min_evidence_items": 5, "min_description_chars": 60, "accept_min_priority": 0.70 },
      # relevance (2026-10-15): bands on relevance, priority recorded alongside.
      # combined: the October 14 single score.
      "actor_score_model": "relevance",
      "actor_relevance_rubric_weights":
        {
          "own_organisational_page": 0.15,
          "real_operating_entity": 0.15,
          "sector_coverage": 0.15,
          "research_development_or_programmes": 0.25,
          "partnerships_or_tech_transfer": 0.15,
          "identity_stated": 0.15,
        },
      "actor_priority_rubric_weights":
        {
          "use_cases": 0.30,
          "open_programmes": 0.12,
          "named_route_in": 0.12,
          "partnership_precedent": 0.10,
          "partnerships_or_tech_transfer": 0.10,
          "network_membership": 0.06,
          "distinctiveness": 0.15,
          "hub_match": 0.05,
        },
      # Decision 2026-10-14: an ACCEPTED actor (score and every gate) is created
      # Verified, labelled agent_auto_accept (migration 560). "parked" sends it
      # to Review for a person to verify instead.
      "actor_auto_accept_status": "verified",
      "actor_rubric_weights":
        {
          "own_organisational_page": 0.10,
          "real_operating_entity": 0.11,
          "research_development_or_programmes": 0.08,
          "partnerships_or_tech_transfer": 0.08,
          "open_programmes": 0.07,
          "partnership_precedent": 0.08,
          "named_route_in": 0.08,
          "network_membership": 0.04,
          "use_cases": 0.16,
          "sector_coverage": 0.07,
          "hub_match": 0.03,
          "distinctiveness": 0.10,
        },
      "event_rubric_max_tokens": 4096,
      "event_rerank_max_tokens": 2048,
      "event_rerank_top_n": 40,
      "event_rerank_group_size": 10,
      "event_score_thresholds": { "auto_low": 0.30, "auto_high": 0.70 },
      "event_rubric_weights":
