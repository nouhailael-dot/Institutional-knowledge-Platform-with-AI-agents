version: architecture-v2-phase5
categories:
  - code: university_academic
    label: University / Academic Institution
    definition: Degree-granting institution or formal academic unit.
    types:
      - [university_system, University or university system]
      - [college_school, College or school within a university]
      - [academic_department, Academic department or program]
      - [branch_campus, Branch campus]
      - [community_technical_college, Community or technical college]
      - [other, Other]
  - code: research_center
    label: Research Center / Institute / Laboratory
    definition: Organization whose main job is research, excluding designated national laboratories.
    types:
      - [independent_institute, Independent research institute]
      - [university_affiliated_center, University-affiliated research center or institute]
      - [research_lab_group, Research laboratory or research group]
      - [other, Other]
  - code: national_laboratory
    label: National Laboratory
    definition: Formally designated national laboratory, FFRDC, or federal research facility with a national mission.
    types:
      - [doe_national_lab, DOE national laboratory]
      - [ffrdc, Other federally funded R&D center (FFRDC)]
      - [federal_research_facility, Federal agency research facility]
      - [other, Other]
  - code: applied_facility
    label: Applied Research Facility / Testbed / Field Site
    definition: Physical site where technology or methods are tested or demonstrated under real conditions.
    types:
      - [experimental_farm_station, Experimental farm or research station]
      - [pilot_demonstration_plant, Pilot or demonstration plant]
      - [testbed, Testbed]
      - [field_site_living_lab, Field site or living lab]
      - [other, Other]
  - code: hospital_clinical
    label: Hospital / Clinical System / Medical Center
    definition: Organization providing clinical care, medical research, or clinical education.
    types:
      - [academic_medical_center, Academic medical center]
      - [health_system, Health system]
      - [hospital, Hospital]
      - [specialty_clinic_center, Specialty clinic or center]
      - [other, Other]
  - code: company
    label: Company / Corporate Actor
    definition: Established commercial or industrial company or business unit.
    types:
      - [large_multinational, Large or multinational corporation]
      - [small_mid_size, Small or mid-size company]
      - [business_unit_subsidiary, Business unit or subsidiary]
      - [corporate_rd_center, Corporate R&D or innovation center]
      - [other, Other]
  - code: startup
    label: Startup / Emerging Technology Company
    definition: Development-stage company commercializing a new technology or business model.
    types:
      - [university_spinout, University spinout]
      - [corporate_spinout, Corporate spinout]
      - [independent_startup, Independent startup]
      - [other, Other]
  - code: innovation_platform
    label: Innovation Platform / Incubator / Accelerator / Venture Studio
    definition: Organization whose main job is supporting startups or innovation.
    types:
      - [incubator, Incubator]
      - [accelerator, Accelerator]
      - [venture_studio, Venture studio]
      - [innovation_center_shared_lab, Innovation center or shared lab space]
      - [tech_transfer_office, Technology-transfer or commercialization office]
      - [other, Other]
  - code: investor
    label: Investor / VC / Funding Platform
    definition: Organization that manages investment capital.
    types:
      - [venture_capital, Venture capital firm]
      - [corporate_venture, Corporate venture arm]
      - [angel_group, Angel group]
      - [impact_climate_fund, Impact or climate fund]
      - [private_equity_growth, Private equity or growth fund]
      - [public_investment_fund, Public or quasi-public investment fund]
      - [other, Other]
  - code: government
    label: Government Agency / Public Authority
    definition: Public-sector body with a government mandate, including public utilities.
    types:
      - [federal_agency, Federal agency]
      - [state_agency, State agency]
      - [local_municipal, Local or municipal government]
      - [regional_authority, Regional or special-purpose authority]
      - [public_utility, Public utility]
      - [other, Other]
  - code: foundation_nonprofit
    label: Foundation / Nonprofit
    definition: Mission-driven nonprofit, including grant makers.
    types:
      - [private_foundation, Private foundation]
      - [corporate_foundation, Corporate foundation]
      - [community_foundation, Community foundation]
      - [operating_nonprofit, Operating nonprofit]
      - [think_tank, Think tank or policy institute]
      - [other, Other]
  - code: association_network
    label: Industry Association / Consortium / Network
    definition: Formal multi-organization group or network.
    types:
      - [trade_association, Trade or industry association]
      - [research_consortium, Research consortium]
      - [professional_society, Professional society]
      - [standards_body, Standards body]
      - [alliance_coalition, Alliance or coalition]
      - [multi_location_network, Statewide or multi-location network]
      - [other, Other]
