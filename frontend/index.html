      ?html`<div class="hint" style=${{margin:"0 0 8px"}}>${e._why_not}</div>`
      :html`<div class="whynot">✕ Doesn't match your request — ${e._why_not||"no reason was recorded for this map."}</div>`)}
    ${(e._possible_duplicates||[]).length>0&&html`<div class="hint" style=${{margin:"0 0 8px"}}>
      Possible duplicate of ${e._possible_duplicates.join(", ")}. Check before verifying.</div>`}
    <${CardTags} e=${e}/>
    <${CardMeta} e=${e}/>
    ${e.description&&html`<div class="mdesc">${e.description}</div>`}
    ${e.bio&&e._entity_type!=="person"&&html`<div class="mdesc">${e.bio}</div>`}
    ${e._entity_type==="actor"?html`<${OrgCardBody} e=${e} deadWeb=${deadWeb}/>`
      :e._entity_type==="event"?html`<${EventCardBody} e=${e}/>`:html`<${PersonCardBody} e=${e}/>`}
    ${e._entity_type==="actor"&&html`<${PeopleSearch} key=${jobId+":"+e.name+":"+(e.website||"")} actor=${e} jobId=${jobId} disabled=${disabled}/>`}
    <${MatchBox} e=${e} lc=${lc}/>
  </div>`;
}

// The rows are the editor; this is the request they produce. Labelled rather than
// woven into prose: the planner's own prompt separates subject matter from
// requirements, so handing it that split already made is less to get wrong.
function requestFromRows(rows){
  if(!rows) return "";
  const parts=[String(rows.topic||"").trim().replace(/\.$/,"")+"."];
  const clause=(label,list)=>{
    const items=(list||[]).map(s=>String(s).trim()).filter(Boolean);
    if(items.length) parts.push(label+": "+items.join("; ")+".");
  };
  clause("Must be",rows.must_be);
  clause("Exclude",rows.exclude);
  clause("Prefer",rows.prefer);
  if(rows.result_limit>0) parts.push("Return "+rows.result_limit+".");
  return parts.join(" ");
}
function askContextFrom(rows){
  if(!rows||!rows.useKnown||!(rows.known_actors||[]).length) return null;
  return "These organizations are already in the database, so they are already known: "
    +rows.known_actors.join(", ")+". Prefer searches that reach beyond them.";
}
const ROW_KINDS=[["must_be","Must be"],["exclude","Exclude"],["prefer","Prefer"]];

function CarriedRows({rows,onChange,onDismiss}){
  const [raw,setRaw]=useState(false);
  const edit=(key,i,value)=>onChange({...rows,[key]:rows[key].map((v,j)=>j===i?value:v)});
  const drop=(key,i)=>onChange({...rows,[key]:rows[key].filter((_,j)=>j!==i)});
  const add=(key)=>onChange({...rows,[key]:[...(rows[key]||[]),""]});
  return html`<div class="hub-suggestion" style=${{marginBottom:"12px"}}>
    <div class="hub-suggestion-title">From your Ask conversation
      <button class="example" type="button" style=${{marginLeft:"auto"}} onClick=${onDismiss}>Discard</button></div>
    ${raw?html`<div class="hint">Editing the request as text. These rows are now a record of what carried over.</div>`:null}
    <div class="mperson-meta carried-row"><b>Topic:</b>
      <input class="rowedit" value=${rows.topic} disabled=${raw}
        onInput=${e=>onChange({...rows,topic:e.target.value})}/></div>
    ${ROW_KINDS.map(([key,label])=>html`<div key=${key}>
      ${(rows[key]||[]).map((value,i)=>html`<div class="mperson-meta carried-row" key=${key+i}>
        <b>${label}:</b>
        <input class="rowedit" value=${value} disabled=${raw}
          onInput=${e=>edit(key,i,e.target.value)}/>
        ${!raw&&html`<button class="example" type="button" title="Remove"
          onClick=${()=>drop(key,i)}>✕</button>`}</div>`)}
      ${!raw&&html`<button class="example" type="button" onClick=${()=>add(key)}>+ ${label}</button>`}
    </div>`)}
    <div class="mperson-meta carried-row"><b>Return:</b>
      <input class="rowedit" type="number" min="0" max="50" value=${rows.result_limit} disabled=${raw}
        onInput=${e=>onChange({...rows,result_limit:Number(e.target.value)||0})}/>
</div>
    ${(rows.known_actors||[]).length>0&&html`<div class="mperson-meta">
      <label><input type="checkbox" checked=${rows.useKnown}
        onChange=${e=>onChange({...rows,useKnown:e.target.checked})}/>
        Already in the database: ${rows.known_actors.join(", ")} — look beyond these</label>
      <span class="hint">Background only, not part of the search.</span></div>`}
    <button class="example" type="button" onClick=${()=>{setRaw(!raw); onChange({...rows,raw:!raw});}}>
      ${raw?"◀ Back to rows":"✎ Edit as text"}</button>
  </div>`;
}

/* Save verified to Compass (28 Oct 2026). The ready cards go to the database
   through the Data Feed and the backend's admission: a new organization with a
   category type is added Verified under the reviewer's name; the rest wait in
   Review Results. A check that writes nothing runs first and on every change. */
const KIND_LABEL={actor:"Organization",event:"Event",person:"Person"};
// " by Name" once accounts record who acted; nothing while it reads "Not recorded".
const byWhom=by=>by&&!String(by).startsWith("Not recorded")?` by ${by}`:"";
const OUTCOME_TEXT={directory:"Will be added to the directory",review:"Will go to Review Results",
  not_saved:"Can't be saved yet"};
function SavePanel({jobId,items,onSaved,onClose}){
  const [sectors,setSectors]=useState([]);
  const [picked,setPicked]=useState({});
  const [checked,setChecked]=useState(null);
  const [attest,setAttest]=useState(false);
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState(null);
  const keyOf=e=>e._entity_type+"|"+ename(e);
  useEffect(()=>{(async()=>{try{
    const d=await (await fetch("/api/datafeed/catalog")).json();
    const list=(d.vocabularies&&d.vocabularies.sectors||[]).map(x=>x.label);
    setSectors(list);
    // The map's own sector when it names one of the database's sectors.
    const guess=e=>{const own=String(e.sector||"").toLowerCase();
      return list.find(l=>own===l.toLowerCase())||list.find(l=>own&&own.includes(l.toLowerCase()))||"";};
    setPicked(Object.fromEntries(items.map(e=>[keyOf(e),guess(e)])));
  }catch(e){setErr("Could not load the sector list.");}})();},[]);
  const records=()=>items.map(e=>({name:ename(e),website:e.website||null,kind:e._entity_type||"actor",
    sector:picked[keyOf(e)]||""}));
  useEffect(()=>{ if(!sectors.length) return; (async()=>{
    setChecked(null); setErr(null);
    try{
      const r=await fetch(`/api/map/${jobId}/save-check`,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({records:records()})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.detail||"Could not check these results.");
      setChecked(d.records);
    }catch(e){setErr(e.message);}
  })();},[sectors,JSON.stringify(picked)]);
  async function save(){
    if(busy) return;
    setBusy(true); setErr(null);
    try{
      const r=await fetch(`/api/map/${jobId}/save`,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({records:records(),attest})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.detail||"Could not save.");
      onSaved(d);
    }catch(e){setErr(e.message);}
    setBusy(false);
  }
  const savable=(checked||[]).filter(c=>c.outcome!=="not_saved").length;
  return html`<div class="card pad save-panel">
    <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <strong>Save verified to Compass</strong>
      <button class="example" type="button" disabled=${busy} onClick=${onClose}>Cancel</button>
    </div>
    <p class="hint">New organizations are added to the Ecosystem Directory as Verified.
      Events, people, and anything that may already be there go to Review Results.</p>
    <table class="grid save-list"><thead><tr><th>Result</th><th>Sector</th><th>What happens</th></tr></thead>
      <tbody>${items.map((e,i)=>{const c=(checked||[])[i];return html`<tr key=${keyOf(e)}>
        <td><div class="name-link">${ename(e)}</div><span class="hint" style=${{margin:0}}>${KIND_LABEL[e._entity_type||"actor"]}</span></td>
        <td><select class="field" value=${picked[keyOf(e)]||""} aria-label=${"Sector for "+ename(e)}
          onChange=${ev=>setPicked(x=>({...x,[keyOf(e)]:ev.target.value}))}>
          <option value="">Choose a sector…</option>
          ${sectors.map(l=>html`<option key=${l} value=${l}>${l}</option>`)}</select></td>
        <td>${!c?html`<span class="spin"></span>`:html`<div class=${c.outcome==="not_saved"?"bad":""}>${OUTCOME_TEXT[c.outcome]}</div>
          ${c.reason&&html`<div class="hint" style=${{margin:0}}>${c.reason}</div>`}`}</td></tr>`;})}</tbody></table>
    <label class="check" style=${{display:"flex",gap:"8px",alignItems:"flex-start",fontSize:"14px"}}>
      <input type="checkbox" checked=${attest} onChange=${ev=>setAttest(ev.target.checked)}/>
      I'm authorized GHUS staff, I checked these results and their sources, and I verify them.</label>
    ${err&&html`<div class="whynot" role="alert" style=${{marginTop:"10px"}}>${err}</div>`}
    <div class="attach-row" style=${{marginTop:"12px"}}>
      <button class="btn" type="button" disabled=${busy||!checked||!savable||!attest} onClick=${save}>
        ${busy?html`<span class="spin"></span> Saving…`:`Save ${savable} to Compass`}</button>
    </div>
  </div>`;
}

function BuildMap({carried,onCarriedChange,onDiscovery}){
  const [jobId,setJobId]=useState(null);
  const [proposing,setProposing]=useState(false);
  const [cost,setCost]=useState(null);
  const [recent,setRecent]=useState([]);
  const [researchAvailable,setResearchAvailable]=useState(false);
  const [researchReason,setResearchReason]=useState("Live research is disabled until a controlled test is approved.");
  const [runStatus,setRunStatus]=useState("draft");
  // Result filters for the whole conversation (Fatima's redesign, 27 Oct 2026).
  const [statusFilter,setStatusFilter]=useState("all");   // all | pending | parked | verified
  const [saving,setSaving]=useState(false);
  const [saveSummary,setSaveSummary]=useState(null);
  const [typeFilter,setTypeFilter]=useState("all");       // all | actor | person | event
  // Results that don't match the request stay folded until asked for (2 Nov 2026).
  const [othersOpen,setOthersOpen]=useState({});
  const boxRef=useRef(null);
  const activeJob=useRef(null);
  const stopped=useRef(false);
  const generation=useRef(0);
  const [desc,setDesc]=useState("");
  const [busy,setBusy]=useState(false);
  const [phase,setPhase]=useState("");        // progress text while polling
  const [res,setRes]=useState(null);          // {tasks,counts,entities}
  const [request,setRequest]=useState("");    // the description the result belongs to
  const [err,setErr]=useState(null);
  const [file,setFile]=useState(null);
  const [docId,setDocId]=useState(null);
  const [verifying,setVerifying]=useState(false);
  // The planning conversation: [{role,content}]. The agent asks what it needs,
  // then decides on its own when to start searching.
  const [msgs,setMsgs]=useState([]);
  const fileRef=useRef(null);
  const pollRef=useRef(null);
  const bottomRef=useRef(null);

  useEffect(()=>{bottomRef.current&&bottomRef.current.scrollIntoView({behavior:"smooth"})},
            [msgs.length,busy]);

  useEffect(()=>()=>clearTimeout(pollRef.current),[]);   // stop polling on unmount

  useEffect(()=>{
    refreshRecent();
    let saved=null;
    try{saved=localStorage.getItem("um6p.mapJobId");}catch(e){}
    if(saved) restore(saved);
  },[]);

  // A carried-over conversation starts its own map. Without this it would land on
  // whatever map was restored from the last session and be silently swallowed.
  const carriedAt=useRef(null);
  useEffect(()=>{
    if(!carried||carried.at===carriedAt.current) return;
    carriedAt.current=carried.at;
    if(busy||verifying){
      setErr("A map is still running. Stop it or wait before carrying a conversation over.");
      return;
    }
    if(msgs.length||res) reset();
  },[carried]);

  // Rows are authoritative until the user switches to editing the text itself.
  useEffect(()=>{
    if(carried&&!carried.raw&&!msgs.length) setDesc(requestFromRows(carried));
  },[carried,msgs.length]);

  // The Dashboard opens one map, with its conversation (restore, as Saved maps does).
  useEffect(()=>{const on=(e)=>{const id=e.detail?.map_id;
      if(e.detail?.tab!=="map"||!id||id===activeJob.current) return;
      if(busy||verifying){setErr("A map is still running. Stop it or wait before opening another map.");return;}
      restore(id);};
    window.addEventListener(NAVIGATE,on); return ()=>window.removeEventListener(NAVIGATE,on);},[busy,verifying]);

  function remember(id){
    activeJob.current=id; setJobId(id);
    try{if(id) localStorage.setItem("um6p.mapJobId",id);
        else localStorage.removeItem("um6p.mapJobId");}catch(e){}
  }

  async function refreshRecent(){
    try{const r=await fetch("/api/maps");
      if(r.ok){const d=await r.json();setRecent(d.maps||[]);setResearchAvailable(d.research_available===true);
        setResearchReason(d.research_disabled_reason||"Live research is disabled.");}
    }catch(e){}
  }

  async function restore(id){
    const version=++generation.current;
    clearTimeout(pollRef.current); stopped.current=false;
    try{
      const r=await fetch("/api/map/"+id);
      const d=await r.json();
      if(version!==generation.current) return;
      // A remembered map that no longer exists: start fresh instead of
      // showing the same error on every visit.
      if(r.status===404){ remember(null); return; }
      if(!r.ok) throw new Error(d.detail||"Could not load the saved map.");
      remember(id); setMsgs(d.messages||[]); setRequest(d.description||"");
      setDesc(""); setFile(null); setDocId(null); setSaving(false); setSaveSummary(null);
      setRes(d.result); setCost(d.cost); setErr(d.error); setRunStatus(d.status);
      const running=["running","planning","verifying"].includes(d.status);
      setBusy(running); setPhase(running?d.stage:"");
      if(running||d.cost.calls.some(c=>c.status==="pending")) poll(id);
    }catch(e){if(version===generation.current){setErr(e.message);setBusy(false);}}
  }

  async function stop(){
    if(!activeJob.current) return;
    stopped.current=true;
    try{
      const r=await post("/api/map/"+activeJob.current+"/stop",{});
      if(!r.ok) throw new Error("Could not stop the map. Its state has not been confirmed.");
      const d=await r.json();
      setCost(d.cost); setRes(d.result); setRunStatus(d.status);
      setErr("Stopped. Saved results remain available. A request already sent may still be charged.");
      setBusy(false); setPhase("");
      clearTimeout(pollRef.current);
      if(d.cost.calls.some(c=>c.status==="pending")) poll(activeJob.current);
      refreshRecent();
    }catch(e){setErr(e.message);}
  }

  async function extendBudget(){
    if(!activeJob.current||busy||verifying||!cost?.can_extend) return;
    const id=activeJob.current, version=generation.current;
    try{
      const r=await post("/api/map/"+id+"/budget-extension",{approve:true});
      const d=await r.json();
      if(version!==generation.current||id!==activeJob.current) return;
      if(!r.ok) throw new Error(d.detail||"Could not confirm the budget extension.");
      setCost(d.cost);
    }catch(e){if(version===generation.current&&id===activeJob.current)setErr(e.message);}
  }

  async function reopen(){
    if(!activeJob.current||busy||!cost?.can_reopen) return;
    const id=activeJob.current, version=generation.current;
    try{
      const r=await post("/api/map/"+id+"/reopen",{});
      const d=await r.json();
      if(version!==generation.current||id!==activeJob.current) return;
      if(!r.ok) throw new Error(d.detail||"Could not reopen the map.");
      setCost(d.cost); setRunStatus(d.status); setErr(null); refreshRecent();
    }catch(e){if(version===generation.current&&id===activeJob.current)setErr(e.message);}
  }

  async function continueResearch(){
    if(!activeJob.current||busy||verifying||!researchAvailable||(!cost?.can_resume&&runStatus!=="ready")) return;
    const id=activeJob.current, version=generation.current;
    setBusy(true);setErr(null);stopped.current=false;
    try{
      const r=await post(runStatus==="ready"?"/api/map":"/api/map/"+id+"/resume",
        runStatus==="ready"?{job_id:id,description:request}:{approve:true});
      const d=await r.json();
      if(version!==generation.current||id!==activeJob.current||stopped.current) return;
      if(!r.ok) throw new Error(d.detail||"Could not continue research.");
      if(d.cost)setCost(d.cost);
      setRunStatus("running");setPhase("Continuing saved research");poll(id);
    }catch(e){if(version===generation.current&&id===activeJob.current){setErr(e.message);setBusy(false);}}
  }

  const MAP_PROMPTS=[
    "Map the [water reuse] ecosystem in [California], including research centers, technology companies, experts, and upcoming events.",
    "Map organizations and experts in [sustainable mining] across [the United States] to identify potential research partners for UM6P.",
    "Map the [agricultural innovation] ecosystem in [the Midwest] to identify organizations, experts, and field sites for a learning expedition.",
  ];

  const post=(url,body)=>fetch(url,{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});

  /* One turn of the conversation. The agent either replies (asking something)
     or decides it has enough and starts building — it never asks permission. */
  async function send(){
    const text=desc.trim();
    if(!text||busy||!researchAvailable) return;
    // A finished map keeps its thread: the planner answers questions about what it
    // found, and searches again only when asked for ground it has not covered.
    if(!["draft","awaiting_reply","done","error"].includes(runStatus)){
      setErr("This map is still working. Wait for it to finish, or stop it first.");return;
    }
    const version=generation.current;
    stopped.current=false;
    const thread=[...msgs,{role:"user",content:text}];
    setMsgs(thread); setDesc(""); setBusy(true); setErr(null);
    setPhase("Thinking…");
    try{
      let mapId=activeJob.current;
      if(!mapId){
        const session=await post("/api/map/session",{});
        if(!session.ok) throw new Error("Could not create a saved map session.");
        mapId=(await session.json()).job_id; remember(mapId);
      }
      let id=docId;
      if(file&&!id){                       // upload once, then refer to it by id
        const fd=new FormData(); fd.append("file",file); fd.append("job_id",mapId);
        const up=await fetch("/api/map/upload",{method:"POST",body:fd});
        if(!up.ok) throw new Error((await up.json()).detail||"Could not read the document.");
        id=mapId; setDocId(id);
      }
      if(stopped.current||version!==generation.current) return;
      setRunStatus("planning"); poll(mapId);
      const r=await post("/api/map/chat",{messages:thread,job_id:mapId,
        ask_context:askContextFrom(carried)});
      if(!r.ok) throw new Error((await r.json()).detail||"Could not reach the planner.");
      const d=await r.json();
      if(stopped.current||version!==generation.current) return;
      clearTimeout(pollRef.current); setCost(d.cost); refreshRecent();

      if(d.status==="reply"){
        setMsgs([...thread,{role:"assistant",content:d.message}]);
        setBusy(false); setPhase("");
        setRunStatus("awaiting_reply");
        return;
      }
      if(d.status==="plan"){
        // It decided. Announce in its own words, then run without asking.
        setMsgs([...thread,{role:"assistant",content:d.summary}]);
        setRequest(thread.filter(m=>m.role==="user").map(m=>m.content).join("\n"));
        setPhase("Searching the web… this takes a few minutes.");
        setRunStatus("running");
        const rr=await post("/api/map",{
          // On a map that already has results, the new message IS the request for
          // the extra ground; the whole thread would carry questions with it.
          description:res?text:thread.filter(m=>m.role==="user").map(m=>m.content).join("\n"),
          job_id:mapId, plan:{tasks:d.tasks,requirements:d.requirements}});
        if(!rr.ok) throw new Error((await rr.json()).detail||"Could not start the map.");
        poll((await rr.json()).job_id);
        return;
      }
      throw new Error(d.message||"The planner could not continue.");
    }catch(e){ if(version===generation.current){setErr(e.message); setBusy(false); setPhase("");
      if(activeJob.current) poll(activeJob.current);}}
  }

  // One small paid call on this map's budget; nothing is saved until the user
  // creates the request on the Discovery page.
  async function proposeDiscovery(){
    if(proposing||!jobId) return;
    setProposing(true); setErr(null);
    try{
      const r=await post("/api/map/"+jobId+"/discovery-brief",{});
      const d=await r.json();
      if(!r.ok) throw new Error(d.detail||"Could not propose a monitoring request.");
      if(d.cost) setCost(d.cost);
      // Straight to Discovery: the request is edited there, not under the map.
      if(onDiscovery) onDiscovery({...d,edited:false});
    }catch(e){ setErr(e.message); }
    setProposing(false);
  }

  function reset(){
    if(busy||verifying) return;
    generation.current++; remember(null); setCost(null); setRunStatus("draft");
    clearTimeout(pollRef.current);
    setMsgs([]); setDesc(""); setRes(null); setErr(null); setSaving(false); setSaveSummary(null);
    setFile(null); setDocId(null); setBusy(false); setPhase("");
    if(fileRef.current) fileRef.current.value="";
  }

  function poll(jobId){
    clearTimeout(pollRef.current);
    const version=generation.current;
    pollRef.current=setTimeout(async()=>{
      try{
        const r=await fetch("/api/map/"+jobId);
        if(!r.ok) throw new Error("Could not read the saved map.");
        const d=await r.json();
        if(version!==generation.current||activeJob.current!==jobId) return;
        setCost(d.cost); setRunStatus(d.status);
        if(d.result) setRes(d.result);
        if(["running","planning","verifying"].includes(d.status)){
          setPhase(d.stage); poll(jobId); return;
        }
        if(d.error) setErr(d.error);
        if(d.status==="awaiting_reply") setMsgs(d.messages||[]);
        if(d.cost.calls.some(c=>c.status==="pending")) poll(jobId);
        refreshRecent();
      }catch(e){
        if(version!==generation.current||activeJob.current!==jobId) return;
        setErr("Lost contact with the server. Progress already saved can be reopened after restart.");
      }
      setBusy(false); setPhase("");
    },3000);
  }

  const all=()=>MGROUPS.flatMap(([k])=>(res&&res.entities&&res.entities[k])||[]);

  const [exporting,setExporting]=useState("");

  async function download(fmt){
    if(exporting) return;
    setExporting(fmt);
    try{
      const r=await post("/api/map/export",{result:res,request,fmt});
      if(!r.ok) throw new Error("export failed");
      const blob=await r.blob();
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url; a.download="um6p-map."+fmt;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }catch(e){ setErr("Could not export the file."); }
    setExporting("");
  }

  function updateOne(updated){
    const k=updated._entity_type;
    const next={...res.entities};
    next[k]=(next[k]||[]).map(x=>ename(x)===ename(updated)?updated:x);
    setRes({...res,entities:next});
  }

  // Send is disabled outside a conversation state; say why and what to do instead.
  function sendBlockedNote(){
    if(!researchAvailable) return null;   // already explained at the top of the page
    const fresh=" Or start a fresh one with “+ New map”.";
    if(runStatus==="cancelled") return (cost?.can_resume
      ? "This map was stopped mid-research. Use “Continue unfinished research” above to carry on."
      : cost?.can_reopen ? "This map was stopped. Use “Reopen this map” above to keep chatting."
      : "This map was stopped.")+fresh;
    if(runStatus==="ready") return "A search plan is ready. Use “Start saved plan” above to run it."+fresh;
    if(runStatus==="budget_stopped") return "This map reached its budget. Approve $1 more above, then continue."+fresh;
    if(runStatus==="interrupted") return "This map was interrupted. Use “Continue unfinished research” above."+fresh;
    return null;
  }

  const total=all().length;

  // The page reads like a chat: each search's results sit right after the message
  // that started it, not in one block under the conversation (asked for on
  // 28 Oct 2026). Maps saved before then have no positions: their results come
  // before the first positioned search, or after the whole conversation.
  const roundCount=res?Math.max((res.rounds||[]).length,1):0;
  function anchorOf(r){
    const after=(res&&res.round_after)||[];
    if(after[r-1]!=null) return Math.min(after[r-1],msgs.length);
    const known=after.filter(a=>a!=null);
    return Math.min(...known,msgs.length);
  }
  const roundsAt=at=>Array.from({length:roundCount},(_,i)=>i+1).filter(r=>anchorOf(r)===at);

  function selectionNote(){
    const outcome=selectionOutcome(res);
    // Newer maps store an exact sentence (it differs after a follow-up);
    // older ones only stored marks, so they get a fixed wording.
    const said=res.selection_outcome&&res.selection_note;
    if(outcome==="failed") return html`<div class="selnote">${said||"Your filters could not be applied to this map — these results are unfiltered."}</div>`;
    if(outcome==="none_matched") return html`<div class="selnote">${said||"None of these organizations matched your filters. They are all shown below, marked as left out."}</div>`;
    if(outcome==="applied") return html`<div class="selnote quiet">${said||matchCount(res)}</div>`;
    return null;
  }

  // One search's results: matches in rank order, then anything selection did not
  // judge, then the exclusions with their reasons. A follow-up lists only what it
  // added, and names what it found again that is already shown above.
  // A people or events search shows only that group; organization searches
  // (and maps saved before map types) keep people under their organizations.
  // Each search has its own type: a follow-up may look for experts or events.
  function groupsFor(r){
    const only={people:"person",events:"event"}[(res.round_types||[])[r-1]||res.map_type];
    return only?MGROUPS.filter(([k])=>k===only):MDISPLAY_GROUPS;
  }
  // Every card the conversation shows, before the result filters.
  function visibleItems(){
    if(!res) return [];
    return Array.from({length:roundCount},(_,i)=>i+1).flatMap(r=>groupsFor(r).flatMap(([k])=>
      ((res.entities&&res.entities[k])||[]).filter(e=>(e._round||1)===r)));
  }
  const statusOf=e=>e._db_save&&e._db_save.outcome!=="not_saved"?"saved":e._review==="ready"?"ready"
    :e._review==="parked"?"parked":"pending";
  // Verified covers both a checked card and one already saved to Compass.
  const statusGroup=e=>["ready","saved"].includes(statusOf(e))?"verified":statusOf(e);
  const passes=e=>(statusFilter==="all"||statusGroup(e)===statusFilter)
    &&(typeFilter==="all"||(e._entity_type||"actor")===typeFilter);

  function roundResults(r){
    const order=e=>e._rank?e._rank:(e._selected===false?1e6:5e5);
    const groups=groupsFor(r);
    const parts=groups.map(([k,label,tone])=>{
      const every=(res.entities&&res.entities[k])||[];
      const items=every.filter(e=>(e._round||1)===r)
        .filter(passes).sort((a,b)=>order(a)-order(b));
      const again=r>1?every.filter(e=>(e._round||1)<r&&(e._seen_in||[]).includes(r)):[];
      return {k,label,tone,items,again};
    }).filter(p=>p.items.length||p.again.length);
    const added=parts.reduce((n,p)=>n+p.items.length,0);
    const latest=r===roundCount;
    const card=(e,i)=>html`<${MapCard} key=${r+"-"+i} e=${e} request=${request}
        jobId=${jobId} onCost=${setCost} onError=${setErr}
        onBusy=${v=>{setVerifying(v);poll(jobId);}}
        disabled=${busy||verifying||!["done","error"].includes(runStatus)} onUpdate=${updateOne}
        onReviewed=${d=>{setRes(d.result);setCost(d.cost);}}
        reviewDisabled=${busy||verifying||["running","planning","verifying"].includes(runStatus)}/>`;
    return html`<div class="mround" key=${"round"+r}>
      ${roundCount>1&&html`<div class="mgroup-h">
        <span class="chip slate">${r===1?"Results":"Follow-up "+(r-1)}</span>
        <span class="n">${added} ${r===1?"":"new "}result${added===1?"":"s"}</span></div>`}
      ${latest&&selectionNote()}
      ${parts.map(p=>html`<div class="mgroup" key=${p.k}>
        ${p.items.length>0&&html`<div class="mgroup-h"><span class=${"chip "+p.tone}>${p.label}</span>
          <span class="n">${p.items.length}</span></div>`}
        ${p.items.filter(e=>e._selected!==false).map(card)}
        ${(()=>{const others=p.items.filter(e=>e._selected===false), key=r+"-"+p.k, open=!!othersOpen[key];
          return others.length>0&&html`<button class="example mothers" type="button" aria-expanded=${open}
              onClick=${()=>setOthersOpen(o=>({...o,[key]:!open}))}>
              ${open?"▾ Hide":"▸ Show"} ${others.length} ${others.length===1?"result that doesn't":"results that don't"} match your request</button>
            ${open&&others.map(card)}`;})()}
        ${p.again.length>0&&html`<div class="hint">${"Also found again, shown above: "+p.again.map(ename).join(", ")+"."}</div>`}
      </div>`)}
      ${r>1&&!parts.length&&html`<div class="hint">This search found nothing new.</div>`}
    </div>`;
  }

  const savedMaps=(cls)=>html`<${SavedMaps} maps=${recent} value=${jobId} disabled=${busy||verifying}
      onPick=${restore} cls=${cls}/>`;
  const attach=html`${file
    ? html`<span class="attach-chip">📎 ${file.name}
        <button class="linkbtn" type="button" onClick=${()=>{setFile(null);
          if(fileRef.current)fileRef.current.value="";}}>Remove</button></span>`
    : html`<label class="attach-btn">📎 Attach a document
        <input ref=${fileRef} type="file" accept=".pdf,.txt,.md" style=${{display:"none"}}
          onChange=${e=>setFile(e.target.files[0]||null)}/></label>`}`;
  // The extra $1 is offered when a map stopped at its budget or has used most of
  // it - not on every map (it read "reached its budget" at $0.95 of $2).
  const needsMore=!!cost&&cost.can_extend&&(runStatus==="budget_stopped"||cost.estimated_usd>=cost.budget_usd*0.8);
  const sendDisabled=busy||verifying||!researchAvailable||!["draft","awaiting_reply","done","error"].includes(runStatus);
  const started=msgs.length>0||!!res||busy;
  const chip=(value,current,set,label)=>html`<button type="button" key=${value}
    class=${"fchip"+(current===value?" on":"")} onClick=${()=>set(value)}>${label}</button>`;
  const shown=visibleItems();
  const readyItems=shown.filter(e=>statusOf(e)==="ready");
  const typesShown=MGROUPS.filter(([k])=>shown.some(e=>(e._entity_type||"actor")===k));

  // Before the first prompt: Fatima's start screen (27 Oct 2026 mockup).
  if(!started) return html`<div class="start">
    <h1 class="hero-h">What would you like to explore?</h1>
    <p class="start-lead">Search external sources to map ecosystems and identify organizations,
      people, and events relevant to your objectives, areas of interest, and geographic focus.</p>
    ${!researchAvailable&&html`<p class="hint">${researchReason} Saved maps remain available.</p>`}
    ${carried&&html`<${CarriedRows} rows=${carried} onChange=${onCarriedChange}
      onDismiss=${()=>{onCarriedChange(null); setDesc("");}}/>`}
    <form class="start-card" onSubmit=${e=>{e.preventDefault();send();}}>
      ${savedMaps("start-select")}
      <textarea ref=${boxRef} class="field start-box" rows="4" readOnly=${!!(carried&&!carried.raw)}
        placeholder="Describe the organizations, people, or events you want to map. Include your objective, sector or topic, and geographic focus."
        value=${desc} onInput=${e=>setDesc(e.target.value)}
        onKeyDown=${e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}></textarea>
      <div class="start-actions">${attach}
        <button class="btn" disabled=${sendDisabled||!desc.trim()}>Start Search</button></div>
    </form>
    ${err&&html`<div class="mprog" style=${{color:"var(--violet)"}}>${err}</div>`}
    <p class="start-note">ⓘ Review findings and check their sources before you verify them and add
      them to the Ecosystem Directory.</p>
    <${PromptList} prompts=${MAP_PROMPTS} onPick=${x=>fillPrompt(x,setDesc,boxRef)}/>
  </div>`;

  return html`<div>
    <div class="map-head">
      <div class="map-title" title=${request||msgs.find(m=>m.role==="user")?.content||""}>${mapTitle(request||msgs.find(m=>m.role==="user")?.content||"New map")}</div>
      <div class="map-tools">
        ${cost&&html`<span class="hint" style=${{margin:0}} aria-live="polite">Cost so far: $${cost.estimated_usd.toFixed(2)}</span>`}
        ${savedMaps("map-select")}
        <button class="example" type="button" disabled=${busy||verifying} onClick=${reset}>+ New map</button>
      </div>
    </div>
    ${!researchAvailable&&html`<p class="hint">${researchReason} Saved maps remain available.</p>`}
    ${cost&&(!cost.usage_complete||needsMore||cost.can_resume||runStatus==="ready"||cost.can_reopen)&&html`<div class="selnote" aria-live="polite">
      ${!cost.usage_complete&&html`<div>Some costs are still being confirmed, so new searches are paused.</div>`}
      ${needsMore&&html`<div>${runStatus==="budget_stopped"?"This map has reached its budget.":"This map is close to its budget."}
        <button class="example" type="button" disabled=${busy||verifying} onClick=${extendBudget}>Approve $1 more</button></div>`}
      ${(cost.can_resume||runStatus==="ready")&&html`<div>
        <button class="example" type="button" disabled=${busy||verifying||!researchAvailable} onClick=${continueResearch}>
          ${runStatus==="ready"?"Start saved plan":"Continue unfinished research"}</button></div>`}
      ${cost.can_reopen&&html`<div>
        <button class="example" type="button" disabled=${busy} onClick=${reopen}>Reopen this map</button></div>`}
    </div>`}

    ${total>0&&html`<div class="filter-bar" role="group" aria-label="Filter results">
      ${chip("all",statusFilter,setStatusFilter,`All ${shown.length}`)}
      ${chip("pending",statusFilter,setStatusFilter,`Pending review ${shown.filter(e=>statusGroup(e)==="pending").length}`)}
      ${chip("parked",statusFilter,setStatusFilter,`Parked ${shown.filter(e=>statusGroup(e)==="parked").length}`)}
      ${chip("verified",statusFilter,setStatusFilter,`Verified ${shown.filter(e=>statusGroup(e)==="verified").length}`)}
      ${typesShown.length>1&&html`<span class="fsep" aria-hidden="true"></span>
        ${chip("all",typeFilter,setTypeFilter,"All types")}
        ${typesShown.map(([k,label])=>chip(k,typeFilter,setTypeFilter,label))}`}
    </div>`}

    <div class="thread">
      ${msgs.map((m,i)=>html`<${React.Fragment} key=${i}>
        ${m.role==="user"
          ? html`<div class="msg user"><div class="bubble user">${m.content}</div></div>`
          : html`<div class="msg bot">
              <div class="avatar">${AVATAR}</div>
              <div class="bubble bot"><div class="answer" ...${md(m.content)}></div></div>
            </div>`}
        ${roundsAt(i+1).map(roundResults)}
      </${React.Fragment}>`)}
      ${msgs.length===0&&roundsAt(0).map(roundResults)}
      ${busy&&html`<div class="mprog" style=${{margin:0}}><span class="spin"></span> ${phase}
        ${jobId&&html`<button class="example" type="button" style=${{marginLeft:"auto"}} onClick=${stop}>Stop</button>`}</div>`}
      ${verifying&&jobId&&html`<button class="example" type="button" onClick=${stop}>Stop</button>`}
      <div ref=${bottomRef}></div>
    </div>

    ${err&&html`<div class="mprog" style=${{color:"var(--violet)"}}>${err}</div>`}

    ${res&&html`<div>
      ${total===0
        ? html`<div class="mprog">${(res.failures||[]).length>0
            ? "The searches failed. Try again, or start a new map."
            : "No entities found for that description. Try being more specific, or naming the technology and geography."}</div>`
        : html`
          <div class="mbar">
            <span class="chip slate">${total} found in this map</span>
            <button class="btn" type="button" disabled=${busy||!readyItems.length||!["done","error"].includes(runStatus)}
              onClick=${()=>{setSaveSummary(null);setSaving(true);}}>Save verified to Compass (${readyItems.length})</button>
            <button class="example" type="button" disabled=${!!exporting}
              onClick=${()=>download("xlsx")}>
              ${exporting==="xlsx"?html`<span class="spin"></span> Excel…`:"⤓ Excel"}</button>
            <button class="example" type="button" disabled=${!!exporting}
              onClick=${()=>download("pptx")}>
              ${exporting==="pptx"?html`<span class="spin"></span> PowerPoint…`:"⤓ PowerPoint"}</button>
          </div>`}
      ${saving&&html`<${SavePanel} jobId=${jobId} items=${readyItems} onClose=${()=>setSaving(false)}
        onSaved=${d=>{setRes(d.result);setCost(d.cost);setSaving(false);
          const n=k=>d.saved.filter(x=>x.outcome===k).length;
          setSaveSummary([n("directory")&&`${n("directory")} added to the directory`,
            n("review")&&`${n("review")} sent to Review Results`,n("not_saved")&&`${n("not_saved")} not saved`]
            .filter(Boolean).join(" · "));}}/>`}
      ${saveSummary&&html`<div class="selnote" role="status" style=${{marginTop:"14px"}}>${saveSummary}</div>`}
      ${res.partial&&!busy&&html`<div class="selnote" style=${{marginTop:"14px"}}>Research is unfinished.</div>`}
      ${(res.failures||[]).length>0&&html`<div class="selnote" style=${{color:"var(--violet)"}}>
        Some searches failed, so this map may be incomplete.</div>`}
      ${total>0&&(res.map_type||"organizations")==="organizations"&&html`<div class="selnote" style=${{marginTop:"22px"}}>
        <strong>Keep finding organizations like these</strong>
        <div>Monitor and Update can keep searching for more of them, every month for as long
          as you choose. This opens the request there, filled in from what you asked,
          and you edit it there before anything is saved.</div>
        <button class="example" type="button" style=${{marginTop:"8px"}}
          disabled=${proposing||busy||verifying||!researchAvailable||!["done","error"].includes(runStatus)}
          onClick=${proposeDiscovery}>
          ${proposing?html`<span class="spin"></span> Proposing…`:"Monitor this topic"}</button>
      </div>`}
    </div>`}

    <div class="composer">
      ${file&&html`<div class="attach-row" style=${{marginTop:0,marginBottom:"10px"}}>${attach}</div>`}
      <form class="ask-form" onSubmit=${e=>{e.preventDefault();send();}}>
        <div class="input-shell">
          ${ICON_SEARCH}
          <textarea class="field" rows="1"
            placeholder="Reply, ask about these results, or ask for more…"
            value=${desc} onInput=${e=>setDesc(e.target.value)}
            onKeyDown=${e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}></textarea>
        </div>
        <button class="btn" disabled=${sendDisabled}>${busy?html`<span class="spin"></span>`:"Send"}</button>
      </form>
      ${!busy&&!verifying&&sendBlockedNote()&&html`<div class="hint" role="status" style=${{marginTop:"8px"}}>${sendBlockedNote()}</div>`}
    </div>
  </div>`;
}

/* ------------------------------------------------------------------ App */
function Browse(){
  const [k,setK]=useState("actors");
  const [focus,setFocus]=useState(null);
  useEffect(()=>{const on=(e)=>{const record=e.detail?.record;
      if(e.detail?.tab!=="browse"||!record) return;
      setK({actor:"actors",person:"people",event:"events"}[record.kind]||"actors");
      setFocus({...record,at:Date.now()});};
    window.addEventListener(NAVIGATE,on); return ()=>window.removeEventListener(NAVIGATE,on);},[]);
  const V={actors:Actors,hubs:Hubs,events:Events,people:People}[k];
  return html`<div>
    <h1 class="hero-h">Ecosystem Directory</h1>
    <p class="start-lead">Find verified organizations, hubs, people, and events. View and edit profiles,
      add GHUS Notes, and record team engagement.</p>
    <div class="subnav">
      ${[["actors","Organizations"],["hubs","Hubs"],["people","People"],["events","Events"]].map(([x,label])=>html`<button key=${x} class=${k===x?"active":""}
        onClick=${()=>setK(x)}>${label}</button>`)}
    </div><${V} focus=${focus}/></div>`;
}
const LOGO=html`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="1.7"><circle cx="6" cy="7" r="2.3"/><circle cx="18" cy="6" r="2.3"/>
  <circle cx="12" cy="17.5" r="2.3"/><path d="M7.9 8.4 10.6 15.6M16.4 7.6 13.2 15.9M8.2 7 15.7 6.3"
  stroke-linecap="round"/></svg>`;
/* Page names from Fatima's COMPASS mockups (27 Oct 2026), all applied 29 Oct.
   Dashboard and Data Feed are not in her menu yet; they keep their names. */
const NAV=[["dashboard","Dashboard"],["ask","Ask Compass"],["map","Explore and Map"],
  ["browse","Ecosystem Directory"],["discovery","Monitor and Update"],["datafeed","Data Feed"],["review","Review Results"]];
const svg=(d)=>html`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const NAV_ICONS={
  dashboard:svg(html`<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>`),
  ask:svg(html`<path d="M4 18.5V6.5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H8.5L4 20z"/>`),
  map:svg(html`<path d="M3.5 6.5 9 4l6 2.5L20.5 4v13.5L15 20l-6-2.5L3.5 20z"/><path d="M9 4v13.5M15 6.5V20"/>`),
  browse:svg(html`<path d="M4 20.5h16M6 20.5V9h4v11.5M10 20.5V4h4v16.5M14 20.5V12h4v8.5"/>`),
  discovery:svg(html`<path d="M4 19.5l5-6 4 3 7-9"/><path d="M15 7.5h5v5"/>`),
  datafeed:svg(html`<path d="M12 15.5V4M7.5 8.5 12 4l4.5 4.5M4.5 15.5v4h15v-4"/>`),
  review:svg(html`<path d="M7 3.5h7l4 4v13H7z"/><path d="M14 3.5v4h4M10 12.5h5M10 16h5"/>`),
};
const COMPASS_MARK=html`<svg class="compass-mark" width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
  <circle cx="22" cy="22" r="20" fill="none" stroke="currentColor" stroke-width="2.2"/>
  <path d="M29.5 14.5 24.6 24.6 14.5 29.5 19.4 19.4z" fill="var(--accent)"/>
  <path d="M19.4 19.4 24.6 24.6 14.5 29.5z" fill="currentColor" opacity=".9"/></svg>`;
function App(){
  const [tab,setTab]=useState("ask");
  // Discovery's Run now opens the actor's profile in Review (discovery.js openInReview).
  useEffect(()=>{const go=()=>setTab("review");window.addEventListener("ghus:open-review",go);
    return ()=>window.removeEventListener("ghus:open-review",go);},[]);
  // The Dashboard's entries open their page; the page itself opens the item.
  useEffect(()=>{const go=(e)=>{if(e.detail?.tab) setTab(e.detail.tab);};window.addEventListener(NAVIGATE,go);
    return ()=>window.removeEventListener(NAVIGATE,go);},[]);
  // Requests with findings not yet opened from the Dashboard: a count on its nav item.
  const [unseen,setUnseen]=useState(0);
  useEffect(()=>{const on=(e)=>setUnseen(e.detail?.count||0);window.addEventListener(DASHBOARD_UNSEEN,on);
    return ()=>window.removeEventListener(DASHBOARD_UNSEEN,on);},[]);
  // Ask -> Build the Map handoff. Client-side only: every page stays mounted, so
  // there is no session to plumb through the backend.
  const [carried,setCarried]=useState(null);
  // A Discovery request proposed from a map, waiting for the Discovery page to open it.
  const [discoveryHandoff,setDiscoveryHandoff]=useState(null);
  // Keep every page mounted when switching tabs. BuildMap owns the active job
  // poll and its result state, so unmounting it makes a running map appear to
  // stop even though the backend worker continues.
  return html`
  <aside class="sidebar">
    <div class="workspace-brand"><div class="brand-logo"><img src="/um6p-global-hubs-logo-light.png" alt="UM6P Global Hubs, United States"/></div></div>
    <div class="compass-brand">${COMPASS_MARK}<div><div class="compass-name">COMPASS</div>
      <div class="compass-tag">Ecosystem Intelligence</div></div></div>
    <nav class="workspace-nav" aria-label="Main navigation">
      ${NAV.map(([id,label])=>html`
        <button key=${id} class=${"nav-item"+(tab===id?" active":"")} aria-current=${tab===id?"page":undefined} onClick=${()=>setTab(id)}><span class="nav-symbol" aria-hidden="true">${NAV_ICONS[id]}</span>${label}${id==="dashboard"&&unseen>0&&html`<span class="nav-badge" aria-label=${`${unseen} new completed runs`}>${unseen}</span>`}</button>`)}
    </nav>
  </aside>
  <div class="workspace-main">
  <header class="workspace-header"><div class="breadcrumb">Workspace<span>/</span><strong>${Object.fromEntries(NAV)[tab]}</strong></div></header>
  <main class="wrap">
    <div style=${{display:tab==="dashboard"?"block":"none"}}><${PageBoundary} name="Dashboard"><${Dashboard}/><//></div>
    <div style=${{display:tab==="ask"?"block":"none"}}><${PageBoundary} name="Ask Compass"><${Ask} onExplore=${()=>setTab("map")}
      onCarryOver=${(d)=>{setCarried({...d,useKnown:true,raw:false,at:Date.now()}); setTab("map");}}/><//></div>
    <div style=${{display:tab==="browse"?"block":"none"}}><${PageBoundary} name="Ecosystem Directory"><${Browse}/><//></div>
    <div style=${{display:tab==="discovery"?"block":"none"}}><${PageBoundary} name="Monitor and Update"><${Discovery}
      handoff=${discoveryHandoff} onHandoffUsed=${()=>setDiscoveryHandoff(null)}/><//></div>
    <div style=${{display:tab==="datafeed"?"block":"none"}}><${PageBoundary} name="Data Feed"><${DataFeed}/><//></div>
    <div style=${{display:tab==="review"?"block":"none"}}><${PageBoundary} name="Review Results"><${Review}/><//></div>
    <div style=${{display:tab==="map"?"block":"none"}}><${PageBoundary} name="Explore and Map"><${BuildMap}
      carried=${carried} onCarriedChange=${setCarried}
      onDiscovery=${(d)=>{setDiscoveryHandoff(d); setTab("discovery");}}/><//></div>
  </main></div>`;
}
createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
