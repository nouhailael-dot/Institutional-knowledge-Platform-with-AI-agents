<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UM6P Intelligence</title>
<style>
  :root{
    --bg:#f4f3ef; --surface:#fffffe; --surface-2:#faf8f4;
    --ink:#17191b; --muted:#697079; --faint:#9aa0a7;
    --line:#e8e4dc; --line-strong:#d9d4ca;
    --accent:#ef7d1a; --accent-2:#f6912f; --accent-ink:#b05707; --accent-soft:#fdeedd;
    --teal:#0e7b71; --teal-soft:#e2f2ef;
    --violet:#5850c4; --violet-soft:#ecebfa;
    --slate:#556072; --slate-soft:#ebedf0;
    --shadow-sm:0 1px 2px rgba(24,24,24,.05);
    --shadow:0 1px 3px rgba(24,24,24,.05),0 10px 26px -8px rgba(24,24,24,.11);
    --shadow-lg:0 2px 8px rgba(24,24,24,.06),0 22px 48px -14px rgba(24,24,24,.20);
    --radius:16px; --radius-sm:11px;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f1113; --surface:#181b1e; --surface-2:#1d2125;
      --ink:#ecedef; --muted:#99a0a7; --faint:#6b7178;
      --line:#282c31; --line-strong:#373c42;
      --accent:#f6a15c; --accent-2:#ffb877; --accent-ink:#f8ab63; --accent-soft:#3a2512;
      --teal:#3fd0c0; --teal-soft:#14302a;
      --violet:#a79ef3; --violet-soft:#211e4d;
      --slate:#aeb6bf; --slate-soft:#252a2f;
      --shadow-sm:0 1px 2px rgba(0,0,0,.35);
      --shadow:0 1px 3px rgba(0,0,0,.4),0 12px 28px -8px rgba(0,0,0,.5);
      --shadow-lg:0 2px 8px rgba(0,0,0,.45),0 24px 52px -14px rgba(0,0,0,.62);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;
    line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    background-image:radial-gradient(900px 420px at 50% -180px,
      color-mix(in srgb,var(--accent) 9%,transparent),transparent);
    background-attachment:fixed}
  a{color:var(--accent-ink);text-decoration:none}
  a:hover{text-decoration:underline}
  button,input,textarea,select{font-family:inherit}

  /* top bar */
  .topbar{position:sticky;top:0;z-index:20;
    background:color-mix(in srgb,var(--bg) 82%,transparent);
    backdrop-filter:saturate(1.3) blur(12px);border-bottom:1px solid var(--line)}
  .topbar-in{max-width:1120px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;gap:20px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand svg{display:block;color:var(--accent)}
  .wordmark{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.2px}
  .wordmark .dot{color:var(--accent)}
  .tabs{margin-left:auto;display:flex;gap:3px;background:var(--surface-2);
    padding:4px;border-radius:12px;border:1px solid var(--line)}
  .tab{border:0;background:transparent;color:var(--muted);font-weight:600;
    padding:7px 18px;border-radius:9px;cursor:pointer;transition:.18s}
  .tab:hover{color:var(--ink)}
  .tab.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}

  .wrap{max-width:1120px;margin:0 auto;padding:40px 24px 90px}

  /* hero */
  .hero-h{font-family:var(--serif);font-weight:600;font-size:30px;letter-spacing:-.2px;
    margin:0 0 8px}
  .lead{color:var(--muted);margin:0 0 24px;font-size:15px;max-width:60ch}

  /* card */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow)}
  .pad{padding:22px 24px}

  /* ask input */
  .ask-form{display:flex;gap:10px;align-items:stretch}
  .input-shell{position:relative;flex:1}
  .in-icon{position:absolute;left:17px;top:16px;color:var(--faint);pointer-events:none}
  .field{width:100%;background:var(--surface);border:1px solid var(--line-strong);
    border-radius:var(--radius-sm);padding:15px 16px;font-size:15px;color:var(--ink);
    transition:border-color .15s,box-shadow .15s}
  .field:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 4px var(--accent-soft)}
  textarea.field{resize:vertical;min-height:56px;padding-left:46px}
  .btn{border:0;color:#fff;font-weight:600;padding:0 24px;border-radius:var(--radius-sm);
    cursor:pointer;white-space:nowrap;background:linear-gradient(180deg,var(--accent-2),var(--accent));
    box-shadow:var(--shadow-sm);transition:filter .15s,transform .05s}
  .btn:hover{filter:brightness(1.05)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.55;cursor:default;filter:none}

  /* chips */
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--slate-soft);
    color:var(--slate);font-size:12px;font-weight:600;padding:4px 11px;border-radius:999px;
    white-space:nowrap;letter-spacing:.1px}
  .chip.accent{background:var(--accent-soft);color:var(--accent-ink)}
  .chip.teal{background:var(--teal-soft);color:var(--teal)}
  .chip.violet{background:var(--violet-soft);color:var(--violet)}
  .chip.slate{background:var(--slate-soft);color:var(--slate)}

  /* answer */
  .answer{font-size:15.5px;line-height:1.65}
  .answer h1,.answer h2,.answer h3{font-family:var(--serif);line-height:1.25;margin:.7em 0 .35em}
  .answer p{margin:.5em 0}
  .answer ul{margin:.4em 0;padding-left:1.2em}
  .answer li{margin:.25em 0}
  .answer code{background:var(--slate-soft);padding:1px 6px;border-radius:6px;
    font-family:var(--mono);font-size:.88em}
  .answer pre{background:var(--surface-2);border:1px solid var(--line);padding:13px 15px;
    border-radius:10px;overflow:auto}
  .answer pre code{background:none;padding:0}
  .answer table{border-collapse:collapse;width:100%;margin:.6em 0;font-size:14px}
  .answer th,.answer td{border:1px solid var(--line);padding:8px 11px;text-align:left}
  .answer th{background:var(--surface-2)}
  .cursor{display:inline-block;width:7px;height:1.05em;background:var(--accent);
    border-radius:2px;vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}

  details.sources{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
  details.sources summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:13.5px;
    list-style:none}
  details.sources summary::-webkit-details-marker{display:none}
  details.sources summary::before{content:"▸ ";color:var(--faint)}
  details.sources[open] summary::before{content:"▾ "}
  .src{padding:13px 0;border-bottom:1px solid var(--line)}
  .src:last-child{border-bottom:0}
  .src .nm{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .src .pv{color:var(--muted);font-size:13.5px;margin-top:4px;line-height:1.5}

  .hint{color:var(--muted);font-size:13px;margin-top:14px;display:flex;align-items:center;
    gap:8px;flex-wrap:wrap}
  .example{background:var(--surface);border:1px solid var(--line-strong);color:var(--muted);
    font-size:13px;padding:7px 13px;border-radius:999px;cursor:pointer;transition:.15s}
  .example:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
  .attach-row{margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  /* browse — segmented control */
  .subnav{display:inline-flex;gap:3px;margin-bottom:22px;background:var(--surface-2);
    padding:4px;border-radius:12px;border:1px solid var(--line)}
  .subnav button{border:0;background:transparent;color:var(--muted);font-weight:600;
    padding:8px 18px;border-radius:9px;cursor:pointer;transition:.18s}
  .subnav button:hover{color:var(--ink)}
  .subnav button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}

  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px}
  .filters label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  select.field,input.field{padding:10px 12px;font-size:14px;border-radius:10px}
  input[type=range]{accent-color:var(--accent);width:100%}
  input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
  .typechips{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px;
    border-top:1px solid var(--line);padding-top:16px}
  .tc{border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);
    font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer;
    transition:.15s}
  .tc:hover{border-color:var(--accent);color:var(--accent-ink)}
  .tc.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}

  .count{margin:22px 2px 12px;font-weight:700;font-size:15px}
  .count b{color:var(--accent-ink)}
  table.grid{width:100%;border-collapse:collapse;font-size:14px}
  table.grid thead th{background:var(--surface-2);text-align:left;color:var(--muted);
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
    padding:11px 14px;border-bottom:1px solid var(--line-strong)}
  table.grid th.num,table.grid td.num{text-align:right}
  table.grid td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.grid tbody tr:last-child td{border-bottom:0}
  table.grid tbody tr{cursor:pointer;transition:background .12s}
  table.grid tbody tr:hover{background:var(--accent-soft)}
  table.grid tbody tr:hover td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
  .name-cell{font-weight:600}
  .dash{color:var(--faint)}
  .trl{display:inline-block;min-width:22px;text-align:center;font-family:var(--mono);
    font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;
    background:var(--accent-soft);color:var(--accent-ink)}
  .tablecap{color:var(--muted);font-size:13px;padding:14px 16px;border-top:1px solid var(--line)}

  /* detail */
  .detail h2{font-family:var(--serif);margin:0 0 5px;font-size:26px;letter-spacing:-.2px}
  .detail .loc{color:var(--muted);margin-bottom:14px}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
  .metric{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface-2)}
  .metric .k{color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;
    letter-spacing:.5px}
  .metric .v{font-size:22px;font-weight:700;font-family:var(--serif);margin-top:4px}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;margin:16px 0}
  .kv .k{color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;
    letter-spacing:.5px;margin-bottom:2px}
  .kv .v{font-weight:600}
  .narr summary{cursor:pointer;font-weight:600;padding:11px 0;border-top:1px solid var(--line);
    list-style:none}
  .narr summary::-webkit-details-marker{display:none}
  .narr summary::before{content:"▸ ";color:var(--faint)}
  .narr[open] summary::before{content:"▾ "}
  .narr p{color:var(--ink);white-space:pre-wrap;margin:2px 0 14px;font-size:14.5px;line-height:1.6}
  .backlink{border:0;background:none;color:var(--accent-ink);font-weight:600;cursor:pointer;
    padding:0;margin-bottom:16px;font-size:13.5px}
  .backlink:hover{text-decoration:underline}
  .empty{color:var(--muted);padding:30px;text-align:center;border:1px dashed var(--line-strong);
    border-radius:12px;background:var(--surface-2)}
  .spin{width:16px;height:16px;border:2px solid var(--line-strong);border-top-color:var(--accent);
    border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .fade{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  /* chat */
  .conv-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .newconv{border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);
    font-weight:600;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;transition:.15s}
  .newconv:hover{border-color:var(--accent);color:var(--accent-ink)}
  .welcome{text-align:center;padding:20px 0 4px}
  .welcome .lead{margin-left:auto;margin-right:auto}
  .welcome .hint{justify-content:center}
  .chat{display:flex;flex-direction:column;gap:16px;margin-bottom:12px}
  .msg{display:flex;gap:10px;align-items:flex-start}
  .msg.user{justify-content:flex-end}
  .avatar{flex:0 0 30px;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);
    color:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm)}
  .bubble{border-radius:16px;padding:12px 16px;max-width:84%}
  .bubble.user{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#fff;
    font-weight:500;border-bottom-right-radius:5px;box-shadow:var(--shadow-sm)}
  .bubble.bot{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
    border-bottom-left-radius:5px;max-width:88%}
  .bubble.bot .answer{font-size:15px}
  .rw{color:var(--muted);font-size:13px;margin:2px 0 10px}
  .rw b{color:var(--accent-ink);font-weight:600}
  .composer{position:sticky;bottom:0;z-index:10;padding:14px 0 20px;margin-top:6px;
    background:linear-gradient(180deg,transparent,var(--bg) 26%)}

  /* ---- Build the Map ---- */
  .mgroup{margin-bottom:30px}
  .mgroup-h{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-family:var(--serif);
    font-size:19px;font-weight:600}
  .mgroup-h .n{color:var(--muted);font-size:13px;font-family:var(--sans);font-weight:500}
  .mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:10px}
  .mcard.weak{opacity:.72;border-style:dashed}
  .mcard .mh{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:7px}
  .mcard .mn{font-weight:650;font-size:15.5px}
  .mcard .mdesc{color:var(--muted);font-size:13.5px;line-height:1.55;margin:6px 0 9px}
  .mrow{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin-bottom:4px}
  .mrow b{color:var(--ink);font-weight:600}
  .msrc{margin-top:9px;font-size:12.5px}
  .msrc a{color:var(--accent-ink);text-decoration:none;border-bottom:1px solid var(--accent-soft)}
  .msrc a:hover{border-bottom-color:var(--accent)}
  .msrc .bad{color:var(--violet);text-decoration:line-through}
  .mbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 22px}
  .score{font-variant-numeric:tabular-nums}
  .mnote{color:var(--muted);font-size:12.5px;margin-top:7px;font-style:italic}
  .mcard.pick{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-soft)}
  .rank{display:inline-flex;align-items:center;justify-content:center;min-width:22px;
    height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;
    font-weight:700;padding:0 6px}
  .why{color:var(--accent-ink);font-size:12.5px;margin-top:8px;padding-left:10px;
    border-left:2px solid var(--accent-soft)}
  .mpeople{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}
  .mpeople summary{cursor:pointer;color:var(--teal);font-size:13px;font-weight:600}
  .mperson{padding:9px 0 6px;display:flex;gap:10px;align-items:flex-start}
  .mperson+.mperson{border-top:1px solid var(--line)}
  .mperson-main{min-width:0;flex:1}
  .mperson-name{font-size:13.5px;font-weight:600}
  .mperson-meta{font-size:12.5px;color:var(--muted)}
  .mperson-links{font-size:12px;white-space:nowrap}
  .selnote{color:var(--muted);font-size:13px;margin:0 0 18px;padding:11px 14px;
    background:var(--surface-2);border-radius:var(--radius-sm);line-height:1.5}
  .resthead{margin:26px 0 12px;color:var(--muted);font-size:13px;font-weight:600}
  .thread{display:flex;flex-direction:column;gap:16px;margin:22px 0}
  .mprog{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:10px;
    padding:26px 0}
  /* Professional workspace: shared layout and interaction language. */
  :root{color-scheme:light;--bg:#f6f7f9;--surface:#fff;--surface-2:#f9fafb;
    --ink:#242831;--muted:#647080;--faint:#7b8491;--line:#e5e8ed;--line-strong:#cbd1da;
    --accent:#d7410b;--accent-2:#ba3508;--accent-ink:#b5360b;--accent-soft:#fff0e9;
    --teal:#14756d;--teal-soft:#e7f4f1;--violet:#6557ad;--violet-soft:#f0edfa;
    --slate:#556072;--slate-soft:#edf0f4;--radius:12px;--radius-sm:8px;
    --shadow-sm:0 1px 3px #18203005;--shadow:0 4px 20px #18203006;
    --shadow-lg:0 12px 36px #18203012;--serif:var(--sans)}
  body{background-image:none;font-size:14px}
  button,a,input,select,textarea{touch-action:manipulation}
  button{transition:background .16s,border-color .16s,box-shadow .16s}
  :focus-visible{outline:3px solid #d7410b70;outline-offset:3px}
  .sidebar{position:fixed;inset:0 auto 0 0;width:236px;background:var(--surface);border-right:1px solid var(--line);padding:30px 20px;display:flex;flex-direction:column;z-index:25}
  .workspace-brand{padding:0 12px 30px}.brand-name{font-size:29px;font-weight:800;letter-spacing:3px;color:var(--accent)}
  .brand-caption{font-size:10px;letter-spacing:1.5px;font-weight:650;color:var(--muted);margin-top:3px}
  .nav-label,.eyebrow{font-size:10px;letter-spacing:1.7px;text-transform:uppercase;font-weight:700;color:var(--muted)}
  .nav-label{padding:14px 12px}.workspace-nav{display:grid;gap:7px}
  .nav-item{display:flex;align-items:center;gap:12px;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:13px 12px;color:var(--muted);font-weight:550;cursor:pointer;font-size:14px}
  .nav-item:hover{background:var(--surface-2);color:var(--ink)}
  .nav-item.active{background:var(--accent-soft);color:var(--accent-ink);border-color:#f5d5c7}
  .nav-symbol{width:21px;height:21px;display:grid;place-items:center;font-size:20px;line-height:1}
  .sidebar-foot{margin-top:auto;border-top:1px solid var(--line);padding:20px 12px 0;font-size:12px;color:var(--muted)}
  .sidebar-foot strong{display:block;color:var(--ink);font-size:13px;margin-bottom:4px}
  .workspace-main{margin-left:236px;min-width:0}
  .workspace-header{height:72px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 42px;background:var(--surface);gap:15px}
  .breadcrumb{color:var(--muted);font-size:12px}.breadcrumb span{margin:0 12px;color:#a4acb7}.breadcrumb strong{color:var(--ink);font-weight:550}
  .workspace-tag{border:1px solid var(--line);padding:5px 10px;border-radius:6px;font-size:11px;color:var(--muted)}
  .wrap{max-width:1240px;padding:40px 42px 70px;margin:0 auto}
  .hero-h{font-family:var(--sans);font-size:32px;letter-spacing:-1px;font-weight:650;margin-bottom:12px}
  .lead{font-size:14px;max-width:720px;line-height:1.8;color:var(--muted)}
  .welcome{padding:28px 0 24px;text-align:left;max-width:none}.welcome .lead{margin-left:0}
  .welcome .eyebrow{color:var(--accent-ink);margin-bottom:16px}
  .prompt-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:30px 0 10px}
  .prompt-card{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 32px 20px 20px;cursor:pointer;color:var(--ink);line-height:1.6;font-size:13px;min-height:130px}
  .prompt-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
  .prompt-card small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:12px;font-weight:650}
  .prompt-card .arrow{position:absolute;right:15px;bottom:19px;color:var(--accent)}
  .card{box-shadow:var(--shadow-sm)}.pad{padding:22px}
  .composer{border-top:0;background:var(--bg);padding-top:18px}.ask-form{gap:12px}
  .input-shell textarea{background:var(--surface);min-height:64px;border-radius:10px}
  .btn{border-radius:8px;font-weight:600;box-shadow:none}.example{border-radius:6px}

  /* Contrast separates navigation, workspace, and research content. */

  /* ============================================================
     MOTION LAYER — interaction and entrance only.
     Purely presentational: no layout reflow, no behaviour change.
     The reduced-motion guard below stays last and overrides all of it.
     ============================================================ */
  :root{
    --ease:cubic-bezier(.22,.61,.36,1);      /* settles, doesn't bounce */
    --ease-out:cubic-bezier(.16,1,.3,1);     /* long, confident decel */
    --t-fast:.15s; --t-mid:.28s; --t-slow:.5s;
  }

  /* --- entrance: content arrives rather than appears --- */
  /* Entrance animates TRANSFORM ONLY — never opacity. An animation that is
     paused, deferred, or never started (hidden tab, throttled compositing)
     holds its from-state; if that state were opacity:0 the page would render
     blank. Worst case here is simply "no movement". */
  @keyframes rise{from{transform:translateY(10px)}to{transform:none}}
  @keyframes slide{from{transform:translateY(9px)}to{transform:none}}
  @keyframes sheen{from{background-position:200% 0}to{background-position:-200% 0}}
  @keyframes pulse-ring{0%{box-shadow:0 0 0 0 var(--accent-soft)}
    70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}

  /* NO fill-mode and no delay on anything that fades: an element's resting
     state must be VISIBLE. With `both`, a run that never starts (hidden tab,
     paused compositing) leaves content stuck at opacity 0 — a blank page.
     Motion is enhancement only; the stagger is carried by transform, which is
     safe to delay because its worst case is simply "no movement". */
  .welcome,.filters,.mprog,.selnote,.hero-h,.lead{animation:rise var(--t-mid) var(--ease-out)}
  .lead{animation-duration:var(--t-slow)}

  /* staggered so a grid or a result list cascades in */
  .prompt-card,.mgroup,.mcard,.msg{animation:slide .45s var(--ease-out)}
  .prompt-card:nth-child(2),.mcard:nth-child(2){animation-delay:.06s}
  .prompt-card:nth-child(3),.mcard:nth-child(3){animation-delay:.12s}
  .mcard:nth-child(4){animation-delay:.18s}
  .mcard:nth-child(5){animation-delay:.24s}
  .mcard:nth-child(n+6){animation-delay:.3s}

  /* --- sidebar: active state grows a rail, hover nudges --- */
  .nav-item{position:relative;transition:background var(--t-fast) var(--ease),
    color var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
  .nav-item::before{content:"";position:absolute;left:0;top:50%;width:3px;height:0;
    background:var(--accent);border-radius:0 3px 3px 0;transform:translateY(-50%);
    transition:height var(--t-mid) var(--ease-out)}
  .nav-item:hover{transform:translateX(3px)}
  .nav-item.active::before{height:62%}
  .nav-symbol{transition:transform var(--t-mid) var(--ease-out)}
  .nav-item:hover .nav-symbol{transform:scale(1.14)}

  /* --- prompt cards: lift, warm border, arrow travels --- */
  .prompt-card{transition:transform var(--t-mid) var(--ease),
    box-shadow var(--t-mid) var(--ease),border-color var(--t-fast) var(--ease)}
  .prompt-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .prompt-card .arrow{transition:transform var(--t-mid) var(--ease-out),
    opacity var(--t-fast) var(--ease);opacity:.55}
  .prompt-card:hover .arrow{transform:translate(3px,-3px);opacity:1}
  .prompt-card:active{transform:translateY(-1px)}

  /* --- buttons: press feedback, primary lifts --- */
  .btn{transition:transform var(--t-fast) var(--ease),
    box-shadow var(--t-mid) var(--ease),filter var(--t-fast) var(--ease)}
  .btn:hover:not(:disabled){transform:translateY(-1px);
    box-shadow:0 6px 18px -6px var(--accent)}
  .btn:active:not(:disabled){transform:translateY(1px);box-shadow:none}
  .example,.tc,.chip{transition:transform var(--t-fast) var(--ease),
    border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease),
    color var(--t-fast) var(--ease)}
  .example:hover,.tc:hover{transform:translateY(-2px)}
  .example:active,.tc:active{transform:translateY(0)}

  /* --- result cards: lift and warm the accent rail --- */
  .mcard{transition:transform var(--t-mid) var(--ease),
    box-shadow var(--t-mid) var(--ease),border-color var(--t-fast) var(--ease)}
  .mcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .mcard.pick{transition:border-left-width var(--t-mid) var(--ease-out),
    transform var(--t-mid) var(--ease),box-shadow var(--t-mid) var(--ease)}
  .mcard.pick:hover{border-left-width:5px}
  .rank{transition:transform var(--t-mid) var(--ease-out)}
  .mcard:hover .rank{transform:scale(1.1) rotate(-4deg)}

  /* --- subnav: the underline grows from the centre --- */
  .subnav button{position:relative;transition:color var(--t-fast) var(--ease)}
  .subnav button::after{content:"";position:absolute;left:50%;right:50%;bottom:-1px;
    height:2px;background:var(--accent);transition:left var(--t-mid) var(--ease-out),
    right var(--t-mid) var(--ease-out)}
  .subnav button:hover::after{left:20%;right:20%}
  .subnav button.active::after{left:0;right:0}

  /* --- inputs: focus blooms --- */
  .input-shell textarea,.filters input,.filters select,.attach-row select{
    transition:border-color var(--t-fast) var(--ease),
      box-shadow var(--t-mid) var(--ease),background var(--t-fast) var(--ease)}
  .input-shell textarea:focus{box-shadow:0 0 0 4px var(--accent-soft)}
  .in-icon{transition:color var(--t-mid) var(--ease),transform var(--t-mid) var(--ease)}
  .input-shell:focus-within .in-icon{color:var(--accent);transform:scale(1.08)}

  /* --- table rows --- */
  table.grid tbody tr{transition:background var(--t-fast) var(--ease),
    box-shadow var(--t-fast) var(--ease)}

  /* --- working state: a long map run should feel alive --- */
  .mprog{position:relative;overflow:hidden}
  .mprog::after{content:"";position:absolute;inset:0;pointer-events:none;

  .spin{animation:sp .7s linear infinite}

  details summary{transition:color var(--t-fast) var(--ease)}

  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<script type="importmap">
{ "imports": {
  "react": "https://esm.sh/react@18.3.1",

<body>
<div id="root"></div>
<script type="module">
import React,{useState,useEffect,useRef} from "react";
import {createRoot} from "react-dom/client";
import htm from "htm";
import {marked} from "marked";
const html = htm.bind(React.createElement);
const md = (t)=>({dangerouslySetInnerHTML:{__html:marked.parse(t||"")}});

/* colour-coded entity chip */
const ETONE={actor:"accent",hub:"teal",event:"violet",uploaded_document:"slate"};
const EChip=({type})=>html`<span class=${"chip "+(ETONE[type]||"slate")}>${(type||"").replace(/_/g," ")}</span>`;

const ICON_SEARCH=html`<svg class="in-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>`;
const AVATAR=html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="1.9"><circle cx="6" cy="7" r="2.1"/><circle cx="18" cy="6" r="2.1"/>
  <circle cx="12" cy="17.5" r="2.1"/><path d="M7.9 8.4 10.6 15.6M16.4 7.6 13.2 15.9M8.2 7 15.7 6.3"
  stroke-linecap="round"/></svg>`;

/* ------------------------------------------------------------------ Ask */
function Ask(){
  const [q,setQ]=useState("");
  const [busy,setBusy]=useState(false);
  const [turns,setTurns]=useState([]);   // conversation: [{id,q,mode,sql,answer,sources,rewritten,done}]
  const [docId,setDocId]=useState(null);
  const [docName,setDocName]=useState(null);
  const [uploading,setUploading]=useState(false);
  const esRef=useRef(null);
  const fileRef=useRef(null);
  const bottomRef=useRef(null);

  const examples=[
    "Who works on phosphogypsum?",
    "How many actors are at TRL 6 or above?",
    "Which hubs focus on water?",
  ];

  async function onFile(e){
    const f=e.target.files[0]; if(!f) return;
    setUploading(true);
    const fd=new FormData(); fd.append("file",f);
    try{
      const r=await fetch("/api/upload",{method:"POST",body:fd});
      if(!r.ok){ const d=await r.json().catch(()=>({detail:"Upload failed"}));
        alert(d.detail||"Upload failed"); }
      else{ const d=await r.json(); setDocId(d.doc_id); setDocName(d.name); }
    } finally { setUploading(false); if(fileRef.current) fileRef.current.value=""; }
  }
  function clearDoc(){ setDocId(null); setDocName(null); }

  const patchLast=(p)=>setTurns(ts=>{
    if(!ts.length) return ts;
    const c=[...ts]; c[c.length-1]={...c[c.length-1],...p}; return c;});

  function ask(question){
    const text=(question??q).trim();
    if(!text) return;
    if(esRef.current) esRef.current.close();
    // recent completed turns become the conversation memory sent to the server
    const hist=turns.filter(t=>t.done&&t.answer).slice(-3)
      .map(t=>({q:t.q, a:(t.answer||"").slice(0,600)}));
    const id=(crypto.randomUUID&&crypto.randomUUID())||String(Math.random());
    setTurns(ts=>[...ts,{id,q:text,mode:null,sql:null,answer:"",sources:[],rewritten:null,done:false}]);
    setQ(""); setBusy(true);
    const url="/api/ask/stream?question="+encodeURIComponent(text)
      +(docId?("&doc_id="+encodeURIComponent(docId)):"")
      +(hist.length?("&history="+encodeURIComponent(JSON.stringify(hist))):"");
    const es=new EventSource(url); esRef.current=es;
    es.addEventListener("meta",e=>{const d=JSON.parse(e.data);
      patchLast({mode:d.mode, sql:d.sql||null, sources:d.sources||[], rewritten:d.rewritten||null});});
    es.addEventListener("delta",e=>{const d=JSON.parse(e.data);
      setTurns(ts=>{const c=[...ts]; const l=c[c.length-1];
        c[c.length-1]={...l, answer:(l.answer||"")+(d.text||"")}; return c;});});
    es.addEventListener("done",()=>{ patchLast({done:true}); setBusy(false); es.close(); });
    es.onerror=()=>{ setBusy(false); es.close();
      setTurns(ts=>{const c=[...ts]; const l=c[c.length-1];
        if(l) c[c.length-1]={...l, done:true,
          answer:l.answer||"Something went wrong reaching the server."}; return c;});};
  }
  function newConversation(){ if(esRef.current)esRef.current.close(); setTurns([]); setBusy(false); setQ(""); }
  useEffect(()=>()=>esRef.current&&esRef.current.close(),[]);
  useEffect(()=>{ if(bottomRef.current) bottomRef.current.scrollIntoView({block:"end",behavior:"smooth"}); },[turns.length]);

  const modeChip=(m)=> m==="sql"
    ? html`<span class="chip accent">⚡ Exact · from the database</span>`
    : m==="doc" ? html`<span class="chip accent">📎 Document + map · cited</span>`
    : m==="semantic" ? html`<span class="chip accent">◎ Map search · cited</span>` : null;

  const empty=turns.length===0;
  return html`
  <div>
    ${empty
      ? html`<div class="welcome">
          <div class="eyebrow">Your research workspace</div>
          <h1 class="hero-h">Turn information into insight.</h1>
          <p class="lead">Ask anything about the actors, hubs, and events we track across
            US innovation ecosystems. Every answer is grounded in the database with cited sources.</p>
          <div class="prompt-grid">
            ${examples.map((x,i)=>html`<button key=${i} class="prompt-card" type="button"
              onClick=${()=>{setQ(x);}}><small>${["Discover expertise","Explore technology","Connect ecosystems"][i]}</small>${x}<span class="arrow" aria-hidden="true">↗</span></button>`)}
          </div>
          <div class="hint">Choose a starting question, then select Ask to run it.</div>
        </div>`
      : html`
        <div class="conv-head"><span class="chip accent">💬 Conversation</span>
          <button class="newconv" type="button" onClick=${newConversation}>＋ New conversation</button></div>
        <div class="chat">
          ${turns.map((t,i)=>{
            const streaming=(i===turns.length-1)&&busy;
            return html`
            <div class="msg user" key=${t.id+"q"}><div class="bubble user">${t.q}</div></div>
            <div class="msg bot" key=${t.id+"a"}>
              <div class="avatar">${AVATAR}</div>
              <div class="bubble bot">
                <div style=${{display:"flex",gap:"10px",alignItems:"center",marginBottom:"10px"}}>
                  ${modeChip(t.mode)}
                  ${streaming&&!t.answer&&html`<span class="chip"><span class="spin"></span> thinking…</span>`}
                </div>
                ${t.rewritten&&html`<div class="rw">Interpreted as: <b>${t.rewritten}</b></div>`}
                <div class="answer" ...${md(t.answer)}></div>
                ${!t.done&&t.answer&&html`<span class="cursor"></span>`}
                ${t.sql&&html`<details class="sources"><summary>SQL query used</summary>
                  <pre style=${{marginTop:"10px"}}><code>${t.sql}</code></pre></details>`}
                ${t.sources.length>0&&html`
                  <details class="sources">
                    <summary>Sources — ${t.sources.length} ${t.sources.length===1?"entity":"entities"} retrieved</summary>
                    ${t.sources.map((s,j)=>html`<div class="src" key=${j}>
                      <div class="nm">${j+1}. ${s.name} <${EChip} type=${s.entity_type}/></div>
                      <div class="pv">${s.preview}</div></div>`)}
                  </details>`}
              </div>
            </div>`;
          })}
          <div ref=${bottomRef}></div>
        </div>`}

    <div class="composer">
      <div class="attach-row" style=${{marginTop:0,marginBottom:"10px"}}>
        ${docName
          ? html`<span class="chip accent">📎 ${docName}</span>
              <button class="example" type="button" onClick=${clearDoc}>Remove</button>
              <span class="hint" style=${{margin:0}}>Answers draw on this document
                <b>and</b> the database.</span>`
          : html`<label class="example" style=${{display:"inline-flex",gap:"7px",alignItems:"center"}}>
              ${uploading
                ? html`<span class="spin"></span> Indexing…`
                : "📎 Attach a document (PDF, .txt, .md)"}
              <input ref=${fileRef} type="file" accept=".pdf,.txt,.md"
                style=${{display:"none"}} onChange=${onFile}/>
            </label>`}
      </div>
      <form class="ask-form" onSubmit=${e=>{e.preventDefault();ask();}}>
        <div class="input-shell">
          ${ICON_SEARCH}
          <textarea class="field" rows="1"
            placeholder=${empty?"Ask about actors, hubs, or events…":"Ask a follow-up…"}
            value=${q} onInput=${e=>setQ(e.target.value)}
            onKeyDown=${e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask();}}}></textarea>
        </div>
        <button class="btn" disabled=${busy}>${busy?html`<span class="spin"></span>`:"Ask"}</button>
      </form>
    </div>
  </div>`;
}

/* --------------------------------------------------------------- Browse */
const api = (p)=>fetch(p).then(r=>r.json());
const dash = (v)=> (v===null||v===undefined||v==="") ? html`<span class="dash">—</span>` : v;
const trlCell=(t)=> t!=null ? html`<span class="trl">${t}</span>` : html`<span class="dash">—</span>`;
const actorCategory=(a)=>a.actor_category||a.actor_type||"";

function useOnce(fn,dep){ const[d,setD]=useState(null);
  useEffect(()=>{let ok=true;fn().then(x=>ok&&setD(x));return()=>{ok=false}},dep||[]);return d; }

function Actors(){
  const data=useOnce(()=>api("/api/browse/actors"));
  const [hub,setHub]=useState("");const[country,setCountry]=useState("");
  const [state,setState]=useState("");const[types,setTypes]=useState([]);
  const [sector,setSector]=useState("");
  const [minTrl,setMinTrl]=useState(0);const[prof,setProf]=useState(false);
  const [text,setText]=useState("");const[sel,setSel]=useState(null);
  if(!data) return html`<${Loading}/>`;
  const {actors,options}=data;
  const matches=actors.filter(a=>
    (!hub||a.hubs.includes(hub)) && (!country||a.country===country) &&
    (!state||a.state===state) && (types.length===0||types.includes(actorCategory(a))) &&
    (!sector||(a.sectors||[]).includes(sector)) &&
    (!minTrl||(a.trl!=null&&a.trl>=minTrl)) && (!prof||a.has_profile) &&
    (!text|| (a.name||"").toLowerCase().includes(text.toLowerCase()) ||

/* Existing-hub suggestions are read-only and never trigger research or DB writes.
   Primary city is not a regional boundary: ambiguous and regional matches need review. */
function hubLocationKey(value){
  return String(value||"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
}
function hubCountryKey(value){
  const key=hubLocationKey(value);
  return ["us","usa","u s","u s a","united states","united states of america"].includes(key)?"us":key;
}
function hubStateKey(value){
  const names="Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|District of Columbia|Florida|Georgia|Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland|Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New Hampshire|New Jersey|New Mexico|New York|North Carolina|North Dakota|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode Island|South Carolina|South Dakota|Tennessee|Texas|Utah|Vermont|Virginia|Washington|West Virginia|Wisconsin|Wyoming".split("|");
  const codes="AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY".split(" ");
  const key=hubLocationKey(value), index=names.findIndex(name=>hubLocationKey(name)===key);
  return index<0?key:codes[index].toLowerCase();
}
function suggestExistingHub(actor,hubs){
  const city=hubLocationKey(actor.city), country=hubCountryKey(actor.country), state=hubStateKey(actor.state);
  if(!city||!country||(country==="us"&&!state))return {matches:[],reason:"Location is incomplete. Review the actor’s city, state, and country."};
  const matches=hubs.filter(h=>{
    if(!h.hub_id||!h.name||hubLocationKey(h.primary_city)!==city||hubCountryKey(h.country)!==country)return false;
    const hubState=hubStateKey(h.state);
    return country==="us"?hubState===state:(!state||!hubState||state===hubState);
  });
  return {matches,reason:matches.length===1?"City, state, and country match the hub’s recorded location. Membership still needs review.":matches.length>1?"Several existing hubs share this location. Review which ecosystem is relevant.":"No exact location match. The actor may belong to a broader regional hub; review is needed."};
}
let existingHubCatalog=null;
function loadExistingHubCatalog(){
  if(!existingHubCatalog)existingHubCatalog=fetch("/api/browse/hubs").then(r=>{
    if(!r.ok)throw new Error("Hub directory unavailable");return r.json();
  }).then(d=>{if(!Array.isArray(d.hubs))throw new Error("Invalid hub directory");return d.hubs;}).catch(error=>{existingHubCatalog=null;throw error;});
  return existingHubCatalog;
}
function HubSuggestion({actor}){
  const [hubs,setHubs]=useState(null),[error,setError]=useState(false),[attempt,setAttempt]=useState(0);
  useEffect(()=>{let active=true;setError(false);loadExistingHubCatalog().then(data=>{if(active)setHubs(data);}).catch(()=>{if(active)setError(true);});return()=>{active=false;};},[attempt]);
  const suggestion=hubs?suggestExistingHub(actor,hubs):null;
  return html`<div class="hub-suggestion">
    <div class="hub-suggestion-title">Ecosystem hub <span class="chip slate">${error?"Unavailable":!suggestion?"Checking directory":suggestion.matches.length===1?"Existing hub · suggested":"Needs review"}</span></div>
    ${error?html`<div class="hint">Could not load existing hubs. <button class="example" onClick=${()=>setAttempt(x=>x+1)}>Retry</button></div>`:suggestion?html`
      ${suggestion.matches.map(h=>html`<div key=${h.hub_id} class="hub-suggestion-name">${h.name}</div>`)}
      <div class="hint">${suggestion.reason}</div>

        <div class="hint">Suggestion only. No database link has been created.</div>
      </details>`}`:html`<div class="hint">Matching against existing hub locations. No web research.</div>`}
  </div>`;
}
function MapCard({e,request,onUpdate,jobId,onCost,onError,onBusy,disabled}){
  const [busy,setBusy]=useState(false);
  const j=e._judge||null, lc=e._link_check||null;

  async function verify(){
    if(disabled||busy) return;
    if(onBusy) onBusy(true);
    setBusy(true);
    try{
      const r=await fetch("/api/map/verify",{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({entities:[e],request,job_id:jobId})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.detail||"Verification failed.");
      if(d.cost&&onCost) onCost(d.cost);
      if(d.error&&onError) onError(d.error);
      if(d.entities&&d.entities[0]) onUpdate(d.entities[0]);
    }catch(err){ if(onError) onError(err.message); }
    setBusy(false);
    if(onBusy) onBusy(false);

  const badge = j && j.relevance_score!=null

    ${(e.website||e.linkedin_url)&&html`<div class="msrc">

        rel="noopener noreferrer">${e.website}</a>`}

      <summary>${e.sources.length} source${e.sources.length>1?"s":""}</summary>

        const res=lc&&(lc.sources||[]).find(r=>r.url===s.url);
        const bad=res&&!res.ok;
        return html`<div key=${i} style=${{marginTop:"5px"}}>
          <a class=${bad?"bad":""} href=${s.url} target="_blank"
            rel="noopener noreferrer">${s.url}</a>
          ${s.supports&&html`<span class="dash"> — ${s.supports}</span>`}</div>`;
      })}
    </details>`}
    ${e._entity_type==="actor"&&(e.people||[]).length>0&&html`
      <details class="mpeople">
        <summary>${e.people.length} key ${e.people.length===1?"person":"people"}</summary>
        ${e.people.map((p,i)=>html`<div class="mperson" key=${(p.full_name||"")+i}>
          <div class="mperson-main">

    ${e._why&&html`<div class="why">${e._why}</div>`}

  const generation=useRef(0);
  const [desc,setDesc]=useState("");
  const [busy,setBusy]=useState(false);
  const [phase,setPhase]=useState("");        // progress text while polling
  const [res,setRes]=useState(null);          // {tasks,counts,entities}
  const [request,setRequest]=useState("");    // the description the result belongs to
  const [err,setErr]=useState(null);
  const [file,setFile]=useState(null);
  const [docId,setDocId]=useState(null);
  const [verifying,setVerifying]=useState(false);
  const [summary,setSummary]=useState(null);
  // The planning conversation: [{role,content}]. The agent asks what it needs,

  const [msgs,setMsgs]=useState([]);

  const pollRef=useRef(null);
  const bottomRef=useRef(null);

  useEffect(()=>{bottomRef.current&&bottomRef.current.scrollIntoView({behavior:"smooth"})},
            [msgs.length,busy]);

  useEffect(()=>()=>clearTimeout(pollRef.current),[]);   // stop polling on unmount

  useEffect(()=>{
    refreshRecent();

    if(saved) restore(saved);
  },[]);

  function remember(id){

    try{if(id) localStorage.setItem("um6p.mapJobId",id);
        else localStorage.removeItem("um6p.mapJobId");}catch(e){}
  }

  async function refreshRecent(){
    try{const r=await fetch("/api/maps");
      if(r.ok){const d=await r.json();setRecent(d.maps||[]);setResearchAvailable(d.research_available===true);
        setResearchReason(d.research_disabled_reason||"Live research is disabled.");}
    }catch(e){}
  }

  async function restore(id){
    const version=++generation.current;
    clearTimeout(pollRef.current); stopped.current=false;
    try{
      const r=await fetch("/api/map/"+id);
      const d=await r.json();
      if(version!==generation.current) return;
      if(!r.ok) throw new Error(d.detail||"Could not load the saved map.");
      remember(id); setMsgs(d.messages||[]); setRequest(d.description||"");
      setDesc(""); setFile(null); setDocId(null); setSummary(null);
      setRes(d.result); setCost(d.cost); setErr(d.error); setRunStatus(d.status);
      const running=["running","planning","verifying"].includes(d.status);
      setBusy(running); setPhase(running?d.stage:"");
      if(running||d.cost.calls.some(c=>c.status==="pending")) poll(id);
    }catch(e){if(version===generation.current){setErr(e.message);setBusy(false);}}
  }

  async function stop(){
    if(!activeJob.current) return;
    stopped.current=true;
    try{
      const r=await post("/api/map/"+activeJob.current+"/stop",{});
      if(!r.ok) throw new Error("Could not stop the map. Its state has not been confirmed.");
      const d=await r.json();
      setCost(d.cost); setRes(d.result); setRunStatus(d.status);
      setErr("Stopped. Saved results remain available. A request already sent may still be charged.");
      setBusy(false); setPhase("");
      clearTimeout(pollRef.current);
      if(d.cost.calls.some(c=>c.status==="pending")) poll(activeJob.current);
      refreshRecent();
    }catch(e){setErr(e.message);}
  }

  async function extendBudget(){
    if(!activeJob.current||busy||verifying||!cost?.can_extend) return;
    const id=activeJob.current, version=generation.current;
    try{
      const r=await post("/api/map/"+id+"/budget-extension",{approve:true});
      const d=await r.json();
      if(version!==generation.current||id!==activeJob.current) return;
      if(!r.ok) throw new Error(d.detail||"Could not confirm the budget extension.");
      setCost(d.cost);
    }catch(e){if(version===generation.current&&id===activeJob.current)setErr(e.message);}
  }

  async function continueResearch(){
    if(!activeJob.current||busy||verifying||!researchAvailable||(!cost?.can_resume&&runStatus!=="ready")) return;
    const id=activeJob.current, version=generation.current;
    setBusy(true);setErr(null);stopped.current=false;
    try{
      const r=await post(runStatus==="ready"?"/api/map":"/api/map/"+id+"/resume",
        runStatus==="ready"?{job_id:id,description:request}:{approve:true});
      const d=await r.json();
      if(version!==generation.current||id!==activeJob.current||stopped.current) return;
      if(!r.ok) throw new Error(d.detail||"Could not continue research.");
      if(d.cost)setCost(d.cost);
      setRunStatus("running");setPhase("Continuing saved research");poll(id);
    }catch(e){if(version===generation.current&&id===activeJob.current){setErr(e.message);setBusy(false);}}
  }

  const examples=["Energy optimization research centers",
                  "Controlled environment agriculture in the US",
                  "Green hydrogen labs and pilot projects"];

  const post=(url,body)=>fetch(url,{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});

  /* One turn of the conversation. The agent either replies (asking something)
     or decides it has enough and starts building — it never asks permission. */
  async function send(){
    const text=desc.trim();
    if(!text||busy||!researchAvailable) return;
    if(!["draft","awaiting_reply"].includes(runStatus)){
      setErr("Start a new map for another request. This map remains saved.");return;
    }
    const version=generation.current;
    stopped.current=false;
    const thread=[...msgs,{role:"user",content:text}];
    setMsgs(thread); setDesc(""); setBusy(true); setErr(null);
    setPhase("Thinking…");
    try{
      let mapId=activeJob.current;
      if(!mapId){
        const session=await post("/api/map/session",{});
        if(!session.ok) throw new Error("Could not create a saved map session.");
        mapId=(await session.json()).job_id; remember(mapId);
      }
      let id=docId;
      if(file&&!id){                       // upload once, then refer to it by id
        const fd=new FormData(); fd.append("file",file); fd.append("job_id",mapId);
        const up=await fetch("/api/map/upload",{method:"POST",body:fd});
        if(!up.ok) throw new Error((await up.json()).detail||"Could not read the document.");
        id=mapId; setDocId(id);
      }
      if(stopped.current||version!==generation.current) return;
      setRunStatus("planning"); poll(mapId);
      const r=await post("/api/map/chat",{messages:thread,job_id:mapId});
      if(!r.ok) throw new Error((await r.json()).detail||"Could not reach the planner.");
      const d=await r.json();
      if(stopped.current||version!==generation.current) return;
      clearTimeout(pollRef.current); setCost(d.cost); refreshRecent();

      if(d.status==="reply"){
        setMsgs([...thread,{role:"assistant",content:d.message}]);
        setBusy(false); setPhase("");
        setRunStatus("awaiting_reply");
        return;
      }
      if(d.status==="plan"){
        // It decided. Announce in its own words, then run without asking.
        setMsgs([...thread,{role:"assistant",content:d.summary}]);
        setRequest(thread.filter(m=>m.role==="user").map(m=>m.content).join("\n"));
        setPhase("Searching the web… this takes a few minutes.");
        setRunStatus("running");
        const rr=await post("/api/map",{
          description:thread.filter(m=>m.role==="user").map(m=>m.content).join("\n"),
          job_id:mapId, plan:{tasks:d.tasks,requirements:d.requirements}});
        if(!rr.ok) throw new Error((await rr.json()).detail||"Could not start the map.");
        poll((await rr.json()).job_id);
        return;
      }
      throw new Error(d.message||"The planner could not continue.");
    }catch(e){ if(version===generation.current){setErr(e.message); setBusy(false); setPhase("");
      if(activeJob.current) poll(activeJob.current);}}
  }

  function reset(){
    if(busy||verifying) return;
    generation.current++; remember(null); setCost(null); setRunStatus("draft");
    clearTimeout(pollRef.current);
    setMsgs([]); setDesc(""); setRes(null); setSummary(null); setErr(null);
    setFile(null); setDocId(null); setBusy(false); setPhase("");
    if(fileRef.current) fileRef.current.value="";
  }

  function poll(jobId){
    clearTimeout(pollRef.current);
    const version=generation.current;
    pollRef.current=setTimeout(async()=>{
      try{
        const r=await fetch("/api/map/"+jobId);
        if(!r.ok) throw new Error("Could not read the saved map.");
        const d=await r.json();
        if(version!==generation.current||activeJob.current!==jobId) return;
        setCost(d.cost); setRunStatus(d.status);
        if(d.result) setRes(d.result);
        if(["running","planning","verifying"].includes(d.status)){
          setPhase(d.stage); poll(jobId); return;
        }
        if(d.error) setErr(d.error);
        if(d.status==="awaiting_reply") setMsgs(d.messages||[]);
        if(d.cost.calls.some(c=>c.status==="pending")) poll(jobId);
        refreshRecent();
      }catch(e){
        if(version!==generation.current||activeJob.current!==jobId) return;
        setErr("Lost contact with the server. Progress already saved can be reopened after restart.");
      }
      setBusy(false); setPhase("");
    },3000);
  }

  const all=()=>MGROUPS.flatMap(([k])=>(res&&res.entities&&res.entities[k])||[]);
  const displayAll=()=>MDISPLAY_GROUPS.flatMap(([k])=>(res&&res.entities&&res.entities[k])||[]);

  const [exporting,setExporting]=useState("");

  async function download(fmt){
    if(exporting) return;
    setExporting(fmt);
    try{
      const r=await post("/api/map/export",{result:res,request,fmt});
      if(!r.ok) throw new Error("export failed");
      const blob=await r.blob();
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url; a.download="um6p-map."+fmt;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }catch(e){ setErr("Could not export the file."); }
    setExporting("");
  }

  async function verifyAll(){
    const items=all();
    if(!items.length||verifying) return;
    setVerifying(true);
    poll(jobId);
    try{
      const r=await fetch("/api/map/verify",{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({entities:items,request,job_id:jobId})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.detail||"Verification failed.");
      if(d.cost) setCost(d.cost);
      if(d.error) setErr(d.error);
      const byKey={}; (d.entities||[]).forEach(x=>{byKey[x._entity_type+"|"+ename(x)]=x;});
      const next={}; MGROUPS.forEach(([k])=>{
        next[k]=((res.entities&&res.entities[k])||[]).map(x=>byKey[k+"|"+ename(x)]||x);
      });
      setRes({...res,entities:next}); setSummary(d.summary);
    }catch(e){ setErr(e.message); }
    setVerifying(false);
    poll(jobId);
  }

  function updateOne(updated){
    const k=updated._entity_type;
    const next={...res.entities};
    next[k]=(next[k]||[]).map(x=>ename(x)===ename(updated)?updated:x);
    setRes({...res,entities:next});
  }

  const total=all().length;

  return html`<div>
    <h1 class="hero-h">Build the map.</h1>
    <p class="lead">Describe a domain, venture, or program. An agent searches the web for
      the US universities, labs, and research centers working on it — plus the people and
      events around them — then you can verify what it found.</p>

    ${!researchAvailable&&html`<p class="hint">${researchReason} Saved maps remain available.</p>`}
    <p class="hint">New maps have a $2 total budget, including planning and verification.
      An extra $1 requires your approval. Existing saved budgets are unchanged.</p>
    ${recent.length>0&&html`<div class="attach-row">
      <label>Saved maps <select disabled=${busy||verifying} value=${jobId||""}
        onChange=${e=>{if(e.target.value)restore(e.target.value);}}>
        <option value="">Choose a map…</option>
        ${recent.map(m=>html`<option value=${m.id} key=${m.id}>
          ${(m.description||"Untitled map").slice(0,65)} — ${m.status}</option>`)}
      </select></label>
    </div>`}
    ${cost&&html`<div class="selnote" aria-live="polite">
      Estimated usage: $${cost.estimated_usd.toFixed(3)} / $${cost.budget_usd.toFixed(2)} budget.
      ${cost.reserved_usd>0?" $"+cost.reserved_usd.toFixed(3)+" reserved or awaiting usage.":""}
      ${!cost.usage_complete?" Some charges are unknown; further calls are blocked.":""}
      ${cost.can_extend&&html`<div>
        <button class="example" type="button" disabled=${busy||verifying} onClick=${extendBudget}>
          Approve extra $1 — $3 total budget
        </button>
        <span class="hint">Approval only; this does not start or resume research.</span>
      </div>`}
      ${cost.budget_usd===3&&html`<div class="hint">$3 total budget approved. Research only continues when you explicitly start it.</div>`}
      ${(cost.can_resume||runStatus==="ready")&&html`<div>
        <button class="example" type="button" disabled=${busy||verifying||!researchAvailable} onClick=${continueResearch}>
          ${runStatus==="ready"?"Start saved plan":"Continue unfinished research"} — uses remaining budget
        </button>
        <span class="hint">Reuses saved work; the total budget does not reset.</span>
      </div>`}
      <details><summary>Cost by stage</summary>
        ${Object.entries(cost.by_stage).map(([stage,value])=>html`<div key=${stage}>${stage}: $${value.toFixed(4)}</div>`)}
        <div class="hint">Estimates use provider-reported usage and configured prices; they are not a billing guarantee.</div>
      </details>
    </div>`}

    <div class="attach-row" style=${{marginTop:0,marginBottom:"10px"}}>
      ${file
        ? html`<span class="chip accent">📎 ${file.name}</span>
            <button class="example" type="button" onClick=${()=>{setFile(null);
              if(fileRef.current)fileRef.current.value="";}}>Remove</button>
            <span class="hint" style=${{margin:0}}>Used as extra context for the search.</span>`
        : html`<label class="example" style=${{display:"inline-flex",gap:"7px",alignItems:"center"}}>
            📎 Attach a strategy or program document (PDF, .txt, .md)
            <input ref=${fileRef} type="file" accept=".pdf,.txt,.md" style=${{display:"none"}}
              onChange=${e=>setFile(e.target.files[0]||null)}/>
          </label>`}
    </div>

    ${msgs.length>0&&html`<div class="thread">
      ${msgs.map((m,i)=> m.role==="user"
        ? html`<div class="msg user" key=${i}><div class="bubble user">${m.content}</div></div>`
        : html`<div class="msg bot" key=${i}>
            <div class="avatar">${AVATAR}</div>
            <div class="bubble bot"><div class="answer" ...${md(m.content)}></div></div>
          </div>`)}
      <div ref=${bottomRef}></div>
    </div>`}

    <form class="ask-form" onSubmit=${e=>{e.preventDefault();send();}}>
      <div class="input-shell">
        ${ICON_SEARCH}
        <textarea class="field" rows="1"
          placeholder=${msgs.length?"Reply…":"Describe the map you want to build…"}
          value=${desc} onInput=${e=>setDesc(e.target.value)}
          onKeyDown=${e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}></textarea>
      </div>
      <button class="btn" disabled=${busy||!researchAvailable||!["draft","awaiting_reply"].includes(runStatus)}>${busy?html`<span class="spin"></span>`:"Send"}</button>
    </form>

    ${!msgs.length&&!busy&&!err&&html`<div class="attach-row">
      ${examples.map(x=>html`<button key=${x} class="example" type="button"
        onClick=${()=>setDesc(x)}>${x}</button>`)}
    </div>`}

    ${(msgs.length>0||res||jobId)&&!busy&&!verifying&&html`<div class="attach-row">
      <button class="example" type="button" onClick=${reset}>+ New map</button>
    </div>`}

    ${busy&&html`<div class="mprog"><span class="spin"></span> ${phase}</div>`}
    ${(busy||verifying)&&jobId&&html`<button class="example" type="button" onClick=${stop}>Stop</button>`}
    ${err&&html`<div class="mprog" style=${{color:"var(--violet)"}}>${err}</div>`}

    ${res&&html`<div style=${{marginTop:"26px"}}>
      ${res.coverage_note&&html`<div class="selnote">${res.partial?"Research is unfinished. ":""}${res.coverage_note}</div>`}
      ${(res.coverage_gaps||[]).length>0&&html`<details class="selnote" open=${!!res.partial}>
        <summary>Coverage gaps and remaining work (${res.coverage_gaps.length})</summary>
        <ul>${res.coverage_gaps.map((gap,i)=>html`<li key=${i}>${gap}</li>`)}</ul>
      </details>`}
      ${(res.failures||[]).length>0&&html`<div class="selnote"
        style=${{color:"var(--violet)"}}>
        ${res.failures.length} of the searches failed, so this map may be incomplete.
        Any collected results are saved.</div>`}
      ${total===0
        ? html`<div class="mprog">${(res.failures||[]).length>0
            ? "The searches failed. Check the saved status and cost before starting another map."
            : "No entities found for that description. Try being more specific, or naming the technology and geography."}</div>`
        : html`
          <div class="mbar">
            <span class="chip slate">${total} found</span>
            <button class="example" type="button" disabled=${verifying||busy||!["done","error"].includes(runStatus)} onClick=${verifyAll}>
              ${verifying?html`<span class="spin"></span> Verifying…`:"Verify all"}</button>
            <button class="example" type="button" disabled=${!!exporting}
              onClick=${()=>download("xlsx")}>
              ${exporting==="xlsx"?html`<span class="spin"></span> Excel…`:"⤓ Excel"}</button>
            <button class="example" type="button" disabled=${!!exporting}
              onClick=${()=>download("pptx")}>
              ${exporting==="pptx"?html`<span class="spin"></span> PowerPoint…`:"⤓ PowerPoint"}</button>
            ${summary&&html`<span class="hint" style=${{margin:0}}>
              ${summary.strong} strong · ${summary.weak} weak
              ${summary.dead_links>0?" · "+summary.dead_links+" dead link(s)":""}
              ${summary.avg_score!=null?" · avg "+summary.avg_score:""}</span>`}
          </div>
          ${res.selection_note&&html`<div class="selnote">${res.selection_note}</div>`}

          ${(()=>{
            // When the request carried requirements, the pipeline marks matches
            // with _rank. Show those first, then the rest under a divider.
            const picked=displayAll().some(e=>e._rank);
            const section=(want)=>MDISPLAY_GROUPS.map(([k,label,tone])=>{
              const items=((res.entities&&res.entities[k])||[])
                .filter(e=>picked?(want?!!e._rank:!e._rank):true);
              if(!items.length) return null;
              return html`<div class="mgroup" key=${(want?"s":"r")+k}>
                <div class="mgroup-h"><span class=${"chip "+tone}>${label}</span>
                  <span class="n">${items.length}</span></div>
                ${items.map((e,i)=>html`<${MapCard} key=${k+i} e=${e} request=${request}
                  jobId=${jobId} onCost=${setCost} onError=${setErr}
                  onBusy=${v=>{setVerifying(v);poll(jobId);}}
                  disabled=${busy||verifying||!["done","error"].includes(runStatus)} onUpdate=${updateOne}/>`)}
              </div>`;
            });
            if(!picked) return section(true);
            const rest=displayAll().filter(e=>!e._rank).length;
            return html`${section(true)}
              ${rest>0&&html`<details>
                <summary class="resthead">Also found — ${rest} not matching your
                  request</summary>
                ${section(false)}
              </details>`}`;
          })()}
          ${res.tasks&&res.tasks.length>0&&html`<details class="msrc" style=${{marginTop:"6px"}}>
            <summary>What the agent searched for</summary>
            ${res.tasks.map((t,i)=>html`<div key=${i} style=${{marginTop:"5px"}}>
              <span class="dash">${t.entity_type}</span> ${t.query}</div>`)}
          </details>`}`}
    </div>`}
  </div>`;
}

/* ------------------------------------------------------------------ App */
function Browse(){
  const [k,setK]=useState("actors");
  const V={actors:Actors,hubs:Hubs,events:Events}[k];
  return html`<div>
    <div class="eyebrow">Ecosystem directory</div>
    <h1 class="hero-h">Explore the knowledge base.</h1>
    <p class="lead">Browse organizations, ecosystem hubs, and events. Use filters to find what matters to your research.</p>
    <div class="subnav">
      ${["actors","hubs","events"].map(x=>html`<button key=${x} class=${k===x?"active":""}
        onClick=${()=>setK(x)}>${x[0].toUpperCase()+x.slice(1)}</button>`)}
    </div><${V}/></div>`;
}
const LOGO=html`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="1.7"><circle cx="6" cy="7" r="2.3"/><circle cx="18" cy="6" r="2.3"/>
  <circle cx="12" cy="17.5" r="2.3"/><path d="M7.9 8.4 10.6 15.6M16.4 7.6 13.2 15.9M8.2 7 15.7 6.3"
  stroke-linecap="round"/></svg>`;
function App(){
  const [tab,setTab]=useState("ask");
  // Keep every page mounted when switching tabs. BuildMap owns the active job
  // poll and its result state, so unmounting it makes a running map appear to
  // stop even though the backend worker continues.
  return html`
  <aside class="sidebar">
    <div class="workspace-brand"><div class="brand-name">UM6P</div><div class="brand-caption">GLOBAL HUBS · UNITED STATES</div></div>
    <div class="nav-label">Intelligence platform</div>
    <nav class="workspace-nav" aria-label="Main navigation">
      ${[["ask","Ask","⌕"],["browse","Browse","▦"],["map","Build the Map","⊕"]].map(([id,label,symbol])=>html`
        <button key=${id} class=${"nav-item"+(tab===id?" active":"")} aria-current=${tab===id?"page":undefined} onClick=${()=>setTab(id)}><span class="nav-symbol" aria-hidden="true">${symbol}</span>${label}</button>`)}
    </nav>
    <div class="sidebar-foot"><strong>Connected intelligence</strong>Organizations, people,<br/>and innovation ecosystems.</div>
  </aside>
  <div class="workspace-main">
  <header class="workspace-header"><div class="breadcrumb">Workspace<span>/</span><strong>${{ask:"Ask",browse:"Browse",map:"Build the Map"}[tab]}</strong></div><div class="workspace-tag">UM6P Intelligence</div></header>
  <main class="wrap">
    <div style=${{display:tab==="ask"?"block":"none"}}><${Ask}/></div>
    <div style=${{display:tab==="browse"?"block":"none"}}><${Browse}/></div>
    <div style=${{display:tab==="map"?"block":"none"}}><${BuildMap}/></div>
  </main></div>`;
}
createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
