<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>COMPASS · Ecosystem Intelligence</title>
<style>
  :root{
    --bg:#f4f3ef; --surface:#fffffe; --surface-2:#faf8f4;
    --ink:#17191b; --muted:#697079; --faint:#9aa0a7;
    --line:#e8e4dc; --line-strong:#d9d4ca;
    --accent:#ef7d1a; --accent-2:#f6912f; --accent-ink:#b05707; --accent-soft:#fdeedd;
    --teal:#0e7b71; --teal-soft:#e2f2ef;
    --violet:#5850c4; --violet-soft:#ecebfa;
    --slate:#556072; --slate-soft:#ebedf0;
    --green:#2f7a33; --green-soft:#e5f2e3; --amber:#94600a; --amber-soft:#fbf0d9; --link:#1f5fa8;
    --orange:#c2570c; --orange-soft:#fdeedd; --red:#b42318; --red-soft:#fdecec;
    --shadow-sm:0 1px 2px rgba(24,24,24,.05);
    --shadow:0 1px 3px rgba(24,24,24,.05),0 10px 26px -8px rgba(24,24,24,.11);
    --shadow-lg:0 2px 8px rgba(24,24,24,.06),0 22px 48px -14px rgba(24,24,24,.20);
    --radius:16px; --radius-sm:11px;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f1113; --surface:#181b1e; --surface-2:#1d2125;
      --ink:#ecedef; --muted:#99a0a7; --faint:#6b7178;
      --line:#282c31; --line-strong:#373c42;
      --accent:#f6a15c; --accent-2:#ffb877; --accent-ink:#f8ab63; --accent-soft:#3a2512;
      --teal:#3fd0c0; --teal-soft:#14302a;
      --violet:#a79ef3; --violet-soft:#211e4d;
      --slate:#aeb6bf; --slate-soft:#252a2f;
      --green:#7fcf83; --green-soft:#16301a; --amber:#f0c060; --amber-soft:#33270f; --link:#82b6f2;
      --orange:#f5a25d; --orange-soft:#3a230f; --red:#f2857a; --red-soft:#3d1714;
      --shadow-sm:0 1px 2px rgba(0,0,0,.35);
      --shadow:0 1px 3px rgba(0,0,0,.4),0 12px 28px -8px rgba(0,0,0,.5);
      --shadow-lg:0 2px 8px rgba(0,0,0,.45),0 24px 52px -14px rgba(0,0,0,.62);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;
    line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    background-image:radial-gradient(900px 420px at 50% -180px,
      color-mix(in srgb,var(--accent) 9%,transparent),transparent);
    background-attachment:fixed}
  a{color:var(--accent-ink);text-decoration:none}
  a:hover{text-decoration:underline}
  button,input,textarea,select{font-family:inherit}

  /* top bar */
  .topbar{position:sticky;top:0;z-index:20;
    background:color-mix(in srgb,var(--bg) 82%,transparent);
    backdrop-filter:saturate(1.3) blur(12px);border-bottom:1px solid var(--line)}
  .topbar-in{max-width:1120px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;gap:20px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand svg{display:block;color:var(--accent)}
  .wordmark{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.2px}
  .wordmark .dot{color:var(--accent)}
  .tabs{margin-left:auto;display:flex;gap:3px;background:var(--surface-2);
    padding:4px;border-radius:12px;border:1px solid var(--line)}
  .tab{border:0;background:transparent;color:var(--muted);font-weight:600;
    padding:7px 18px;border-radius:9px;cursor:pointer;transition:.18s}
  .tab:hover{color:var(--ink)}
  .tab.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}

  .wrap{max-width:1120px;margin:0 auto;padding:40px 24px 90px}

  /* hero */
  .hero-h{font-family:var(--serif);font-weight:600;font-size:30px;letter-spacing:-.2px;
    margin:0 0 8px}
  .lead{color:var(--muted);margin:0 0 24px;font-size:15px;max-width:60ch}

  /* card */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow)}
  .pad{padding:22px 24px}

  /* ask input */
  .ask-form{display:flex;gap:10px;align-items:stretch}
  .input-shell{position:relative;flex:1}
  .in-icon{position:absolute;left:17px;top:16px;color:var(--faint);pointer-events:none}
  .field{width:100%;background:var(--surface);border:1px solid var(--line-strong);
    border-radius:var(--radius-sm);padding:15px 16px;font-size:15px;color:var(--ink);
    transition:border-color .15s,box-shadow .15s}
  .field:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 4px var(--accent-soft)}
  textarea.field{resize:vertical;min-height:56px}
  .input-shell textarea.field{padding-left:46px}
  .btn{border:0;color:#fff;font-weight:600;padding:0 24px;border-radius:var(--radius-sm);
    cursor:pointer;white-space:nowrap;background:linear-gradient(180deg,var(--accent-2),var(--accent));
    box-shadow:var(--shadow-sm);transition:filter .15s,transform .05s}
  .btn:hover{filter:brightness(1.05)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.55;cursor:default;filter:none}

  /* chips */
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--slate-soft);
    color:var(--slate);font-size:12px;font-weight:600;padding:4px 11px;border-radius:999px;
    white-space:nowrap;letter-spacing:.1px}
  .chip.accent{background:var(--accent-soft);color:var(--accent-ink)}
  .chip.teal{background:var(--teal-soft);color:var(--teal)}
  .chip.violet{background:var(--violet-soft);color:var(--violet)}
  .chip.slate{background:var(--slate-soft);color:var(--slate)}
  .chip.green{background:var(--green-soft);color:var(--green)}
  .chip.amber{background:var(--amber-soft);color:var(--amber)}
  .chip.red{background:var(--red-soft);color:var(--red)}
  .chip.orange{background:var(--orange-soft);color:var(--orange)}
  .chip.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
  .mwhy-box{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--slate-soft)}
  .mwhy-box>summary{cursor:pointer;margin:0}.mwhy-box[open]>summary{margin-bottom:6px}
  .mwhy-h{font-weight:600;font-size:.9em;margin-bottom:4px;color:var(--slate)}
  .mothers{margin:6px 0 14px}
  .mtags{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px}
  .mtag{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
  .mtag.cat{background:var(--teal-soft);color:var(--teal)}
  .mmeta{color:var(--muted);font-size:14.5px;margin:0 0 10px}.msep{margin:0 4px;color:var(--line-strong)}
  .mfg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 32px;margin:14px 0 6px}
  .mfg .f{min-width:0}.mfg .f.wide{grid-column:1/-1}
  .mfg .k{font-size:12.5px;font-weight:650;color:var(--muted);margin-bottom:2px}
  .mfg .v{font-size:14.5px;color:var(--ink);line-height:1.5;overflow-wrap:anywhere}
  .mfg a{color:var(--link);text-decoration:none;font-weight:550}.mfg a:hover{text-decoration:underline}
  .mpill{display:inline-block;margin:0 6px 4px 0;padding:2px 10px;border-radius:999px;background:#eaf1fb;color:#1f5fa8!important;font-size:12.5px}
  .madd{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .mhead{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:2px}
  .mwhy-box>summary{display:flex;justify-content:space-between;align-items:center;gap:12px;list-style:none;cursor:pointer}
  .mwhy-box>summary::-webkit-details-marker,.msources>summary::-webkit-details-marker{display:none}
  .mwhy-t{font-weight:650;color:var(--ink);font-size:14.5px}
  .mwhy-right{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13.5px}
  .mstrength{font-weight:600;padding:2px 10px;border-radius:999px;background:var(--green-soft);color:var(--green)}
  .mstrength.moderate{background:var(--amber-soft);color:var(--amber)}
  .mchev{transition:transform .15s;font-size:16px;line-height:1;color:var(--muted)}
  .mbar .btn{padding:9px 18px;font-size:14px}details[open]>summary .mchev{transform:rotate(180deg)}
  .msources{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
  .msources>summary{display:flex;justify-content:space-between;cursor:pointer;list-style:none;font-weight:600;font-size:14px;color:var(--ink)}
  .msources ul{list-style:none;margin:8px 0 0;padding:0}
  .msources li{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:16px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
  .msources li:last-child{border-bottom:0}.msources a{color:var(--link);text-decoration:none;font-weight:550}
  .msupp{color:var(--muted)}
  @media(max-width:700px){.mfg{grid-template-columns:1fr}.msources li{grid-template-columns:1fr;gap:2px}}
  .madd-box{margin-top:12px;padding:10px 12px;border-radius:8px;border:1px solid var(--line)}
  .mrow.mfacts{flex-direction:column;align-items:flex-start;gap:4px}
  .badges.inline{display:inline-flex;gap:5px;margin:4px 0 0}
  .name-link{color:var(--link);font-weight:600}
  .dir-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:14px}
  .dir-row .check,.edit-field .check{display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:600;
    color:var(--ink);text-transform:none;letter-spacing:0}
  .more-filters summary{cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:600}
  .dir-count{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 12px}
  .edit-form{margin-top:14px;max-width:760px}
  .edit-group{margin-top:20px}
  .edit-h{font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:10px}
  .edit-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .edit-field>label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .edit-long{width:100%;resize:vertical;font-family:var(--sans);line-height:1.5;padding:9px 11px}
  .edit-ro{color:var(--muted);font-size:14px;padding:4px 0}

  /* answer */
  .answer{font-size:15.5px;line-height:1.65}
  .answer h1,.answer h2,.answer h3{font-family:var(--serif);line-height:1.25;margin:.7em 0 .35em}
  .answer p{margin:.5em 0}
  .answer ul{margin:.4em 0;padding-left:1.2em}
  .answer li{margin:.25em 0}
  .answer code{background:var(--slate-soft);padding:1px 6px;border-radius:6px;
    font-family:var(--mono);font-size:.88em}
  .answer pre{background:var(--surface-2);border:1px solid var(--line);padding:13px 15px;
    border-radius:10px;overflow:auto}
  .answer pre code{background:none;padding:0}
  .answer table{border-collapse:collapse;width:100%;margin:.6em 0;font-size:14px}
  .answer th,.answer td{border:1px solid var(--line);padding:8px 11px;text-align:left}
  .answer th{background:var(--surface-2)}
  .cursor{display:inline-block;width:7px;height:1.05em;background:var(--accent);
    border-radius:2px;vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}

  details.sources{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
  details.sources summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:13.5px;
    list-style:none}
  details.sources summary::-webkit-details-marker{display:none}
  details.sources summary::before{content:"▸ ";color:var(--faint)}
  details.sources[open] summary::before{content:"▾ "}
  .src{padding:13px 0;border-bottom:1px solid var(--line)}
  .src:last-child{border-bottom:0}
  .src .nm{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .src .pv{color:var(--muted);font-size:13.5px;margin-top:4px;line-height:1.5}

  .hint{color:var(--muted);font-size:13px;margin-top:14px;display:flex;align-items:center;
    gap:8px;flex-wrap:wrap}
  .example{background:var(--surface);border:1px solid var(--line-strong);color:var(--muted);
    font-size:13px;padding:7px 13px;border-radius:999px;cursor:pointer;transition:.15s}
  .example:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
  .attach-row{margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  /* browse — segmented control */
  .subnav{display:inline-flex;gap:3px;margin-bottom:22px;background:var(--surface-2);
    padding:4px;border-radius:12px;border:1px solid var(--line)}
  .subnav button{border:0;background:transparent;color:var(--muted);font-weight:600;
    padding:8px 18px;border-radius:9px;cursor:pointer;transition:.18s}
  .subnav button:hover{color:var(--ink)}
  .subnav button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}

  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px}
  .filters label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  select.field,input.field{padding:10px 12px;font-size:14px;border-radius:10px}
  input[type=range]{accent-color:var(--accent);width:100%}
  input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
  .typechips{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px;
    border-top:1px solid var(--line);padding-top:16px}
  .tc{border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);
    font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer;
    transition:.15s}
  .tc:hover{border-color:var(--accent);color:var(--accent-ink)}
  .tc.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}

  .count{margin:22px 2px 12px;font-weight:700;font-size:15px}
  .count b{color:var(--accent-ink)}
  table.grid{width:100%;border-collapse:collapse;font-size:14px}
  table.grid thead th{background:var(--surface-2);text-align:left;color:var(--muted);
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
    padding:11px 14px;border-bottom:1px solid var(--line-strong)}
  table.grid th.num,table.grid td.num{text-align:right}
  table.grid td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.grid tbody tr:last-child td{border-bottom:0}
  table.grid tbody tr{cursor:pointer;transition:background .12s}
  table.grid tbody tr:hover{background:var(--accent-soft)}
  table.grid tbody tr:hover td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
  .name-cell{font-weight:600}
  .dash{color:var(--faint)}
  .trl{display:inline-block;min-width:22px;text-align:center;font-family:var(--mono);
    font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;
    background:var(--accent-soft);color:var(--accent-ink)}
  .tablecap{color:var(--muted);font-size:13px;padding:14px 16px;border-top:1px solid var(--line)}

  /* detail */
  .detail h2{font-family:var(--serif);margin:0 0 5px;font-size:26px;letter-spacing:-.2px}
  .detail .loc{color:var(--muted);margin-bottom:14px}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
  .metric{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface-2)}
  .metric .k{color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;
    letter-spacing:.5px}
  .metric .v{font-size:22px;font-weight:700;font-family:var(--serif);margin-top:4px}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;margin:16px 0}
  .kv .k{color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;
    letter-spacing:.5px;margin-bottom:2px}
  .kv .v{font-weight:600}
  .narr summary{cursor:pointer;font-weight:600;padding:11px 0;border-top:1px solid var(--line);
    list-style:none}
  .narr summary::-webkit-details-marker{display:none}
  .narr summary::before{content:"▸ ";color:var(--faint)}
  .narr[open] summary::before{content:"▾ "}
  .narr p{color:var(--ink);white-space:pre-wrap;margin:2px 0 14px;font-size:14.5px;line-height:1.6}
  .backlink{border:0;background:none;color:var(--accent-ink);font-weight:600;cursor:pointer;
    padding:0;margin-bottom:16px;font-size:13.5px}
  .backlink:hover{text-decoration:underline}
  .empty{color:var(--muted);padding:30px;text-align:center;border:1px dashed var(--line-strong);
    border-radius:12px;background:var(--surface-2)}
  .spin{width:16px;height:16px;border:2px solid var(--line-strong);border-top-color:var(--accent);
    border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .fade{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  /* chat */
  .conv-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .newconv{border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);
    font-weight:600;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;transition:.15s}
  .newconv:hover{border-color:var(--accent);color:var(--accent-ink)}
  .carry-row{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding-left:42px}
  .welcome{text-align:center;padding:20px 0 4px}
  .welcome .lead{margin-left:auto;margin-right:auto}
  .welcome .hint{justify-content:center}
  .chat{display:flex;flex-direction:column;gap:16px;margin-bottom:12px}
  .msg{display:flex;gap:10px;align-items:flex-start}
  .msg.user{justify-content:flex-end}
  .avatar{flex:0 0 38px;width:38px;height:38px;border-radius:50%;background:var(--accent-soft);
    color:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);
    font-weight:750;font-size:17px;line-height:1}
  .bubble{border-radius:16px;padding:12px 16px;max-width:84%}
  .bubble.user{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#fff;
    font-weight:500;border-bottom-right-radius:5px;box-shadow:var(--shadow-sm)}
  .bubble.bot{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
    border-bottom-left-radius:5px;max-width:88%}
  .bubble.bot .answer{font-size:15px}
  .rw{color:var(--muted);font-size:13px;margin:2px 0 10px}
  .rw b{color:var(--accent-ink);font-weight:600}
  .composer{position:sticky;bottom:0;z-index:10;padding:14px 0 20px;margin-top:6px;
    background:linear-gradient(180deg,transparent,var(--bg) 26%)}

  /* ---- Build the Map ---- */
  .mgroup{margin-bottom:30px}
  .mround{margin:4px 0 8px}
  .mgroup-h{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-family:var(--serif);
    font-size:19px;font-weight:600}
  .mgroup-h .n{color:var(--muted);font-size:13px;font-family:var(--sans);font-weight:500}
  .mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:10px}
  .mcard.weak{opacity:.72;border-style:dashed}
  .mcard.nomatch{opacity:.74}
  .whynot{font-size:13px;color:#9a4a21;margin:0 0 8px}
  .mcard .mh{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:7px}
  .mcard .mn{font-weight:650;font-size:15.5px}
  .mcard .mdesc{color:var(--muted);font-size:13.5px;line-height:1.55;margin:6px 0 9px}
  .mrow{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin-bottom:4px}
  .mrow b{color:var(--ink);font-weight:600}
  .msrc{margin-top:9px;font-size:12.5px}
  .msrc a{color:var(--accent-ink);text-decoration:none;border-bottom:1px solid var(--accent-soft)}
  .msrc a:hover{border-bottom-color:var(--accent)}
  .msrc .bad{color:var(--violet);text-decoration:line-through}
  .mbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 22px}
  .score{font-variant-numeric:tabular-nums}
  .mnote{color:var(--muted);font-size:12.5px;margin-top:7px;font-style:italic}
  .mcard.pick{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-soft)}
  .rank{display:inline-flex;align-items:center;justify-content:center;min-width:22px;

  /* ============================================================
     MOTION LAYER — interaction and entrance only.
     Purely presentational: no layout reflow, no behaviour change.
     The reduced-motion guard below stays last and overrides all of it.
     ============================================================ */
  :root{
    --ease:cubic-bezier(.22,.61,.36,1);      /* settles, doesn't bounce */
    --ease-out:cubic-bezier(.16,1,.3,1);     /* long, confident decel */
    --t-fast:.15s; --t-mid:.28s; --t-slow:.5s;
  }

  /* --- entrance: content arrives rather than appears --- */
  /* Entrance animates TRANSFORM ONLY — never opacity. An animation that is
     paused, deferred, or never started (hidden tab, throttled compositing)
     holds its from-state; if that state were opacity:0 the page would render
     blank. Worst case here is simply "no movement". */
  @keyframes rise{from{transform:translateY(10px)}to{transform:none}}
  @keyframes slide{from{transform:translateY(9px)}to{transform:none}}
  @keyframes sheen{from{background-position:200% 0}to{background-position:-200% 0}}
  @keyframes pulse-ring{0%{box-shadow:0 0 0 0 var(--accent-soft)}
    70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}

  /* NO fill-mode and no delay on anything that fades: an element's resting
     state must be VISIBLE. With `both`, a run that never starts (hidden tab,
     paused compositing) leaves content stuck at opacity 0 — a blank page.
     Motion is enhancement only; the stagger is carried by transform, which is
     safe to delay because its worst case is simply "no movement". */
  .welcome,.filters,.mprog,.selnote,.hero-h,.lead{animation:rise var(--t-mid) var(--ease-out)}
  .lead{animation-duration:var(--t-slow)}

  /* staggered so a grid or a result list cascades in */
  .prompt-card,.mgroup,.mcard,.msg{animation:slide .45s var(--ease-out)}
  .prompt-card:nth-child(2),.mcard:nth-child(2){animation-delay:.06s}
  .prompt-card:nth-child(3),.mcard:nth-child(3){animation-delay:.12s}
  .mcard:nth-child(4){animation-delay:.18s}
  .mcard:nth-child(5){animation-delay:.24s}
  .mcard:nth-child(n+6){animation-delay:.3s}

  /* --- sidebar: active state grows a rail, hover nudges --- */
  .nav-item{position:relative;transition:background var(--t-fast) var(--ease),
    color var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
  .nav-item::before{content:"";position:absolute;left:0;top:50%;width:3px;height:0;
    background:var(--accent);border-radius:0 3px 3px 0;transform:translateY(-50%);
    transition:height var(--t-mid) var(--ease-out)}
  .nav-item:hover{transform:translateX(3px)}
  .nav-item.active::before{height:62%}
  .nav-symbol{transition:transform var(--t-mid) var(--ease-out)}
  .nav-item:hover .nav-symbol{transform:scale(1.14)}

  /* --- prompt cards: lift, warm border, arrow travels --- */
  .prompt-card{transition:transform var(--t-mid) var(--ease),
    box-shadow var(--t-mid) var(--ease),border-color var(--t-fast) var(--ease)}
  .prompt-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .prompt-card .arrow{transition:transform var(--t-mid) var(--ease-out),
    opacity var(--t-fast) var(--ease);opacity:.55}
  .prompt-card:hover .arrow{transform:translate(3px,-3px);opacity:1}
  .prompt-card:active{transform:translateY(-1px)}

  /* --- buttons: press feedback, primary lifts --- */
  .btn{transition:transform var(--t-fast) var(--ease),
    box-shadow var(--t-mid) var(--ease),filter var(--t-fast) var(--ease)}
  .btn:hover:not(:disabled){transform:translateY(-1px);
    box-shadow:0 6px 18px -6px var(--accent)}
  .btn:active:not(:disabled){transform:translateY(1px);box-shadow:none}
  .example,.tc,.chip{transition:transform var(--t-fast) var(--ease),
    border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease),
    color var(--t-fast) var(--ease)}
  .example:hover,.tc:hover{transform:translateY(-2px)}
  .example:active,.tc:active{transform:translateY(0)}

  /* --- result cards: lift and warm the accent rail --- */
  .mcard{transition:transform var(--t-mid) var(--ease),
    box-shadow var(--t-mid) var(--ease),border-color var(--t-fast) var(--ease)}
  .mcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .mcard.pick{transition:border-left-width var(--t-mid) var(--ease-out),
    transform var(--t-mid) var(--ease),box-shadow var(--t-mid) var(--ease)}
  .mcard.pick:hover{border-left-width:5px}
  .rank{transition:transform var(--t-mid) var(--ease-out)}
  .mcard:hover .rank{transform:scale(1.1) rotate(-4deg)}

  /* --- subnav: the underline grows from the centre --- */
  .subnav button{position:relative;transition:color var(--t-fast) var(--ease)}
  .subnav button::after{content:"";position:absolute;left:50%;right:50%;bottom:-1px;
    height:2px;background:var(--accent);transition:left var(--t-mid) var(--ease-out),
    right var(--t-mid) var(--ease-out)}
  .subnav button:hover::after{left:20%;right:20%}
  .subnav button.active::after{left:0;right:0}

  /* --- inputs: focus blooms --- */
  .input-shell textarea,.filters input,.filters select,.attach-row select{
    transition:border-color var(--t-fast) var(--ease),
      box-shadow var(--t-mid) var(--ease),background var(--t-fast) var(--ease)}
  .input-shell textarea:focus{box-shadow:0 0 0 4px var(--accent-soft)}
  .in-icon{transition:color var(--t-mid) var(--ease),transform var(--t-mid) var(--ease)}
  .input-shell:focus-within .in-icon{color:var(--accent);transform:scale(1.08)}

  /* --- table rows --- */
  table.grid tbody tr{transition:background var(--t-fast) var(--ease),
    box-shadow var(--t-fast) var(--ease)}

  /* --- working state: a long map run should feel alive --- */
  .mprog{position:relative;overflow:hidden}
  .mprog::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(100deg,transparent 35%,var(--accent-soft) 50%,transparent 65%);
    background-size:200% 100%;opacity:.55;animation:sheen 2.6s linear infinite}
  .spin{animation:sp .7s linear infinite}
  .btn:disabled .spin{animation:sp .55s linear infinite}

  /* --- disclosure + links --- */
  details summary{transition:color var(--t-fast) var(--ease)}
  details summary:hover{color:var(--accent-ink)}
  .msrc a{transition:border-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}

  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

  /* Larger text across the platform (asked for on 30 Oct and 2 Nov 2026). Kept
     last so it wins over the earlier, smaller sizes. */
  body{font-size:15.5px}
  .nav-item{font-size:15px}
  .hint,.tablecap,.selnote,.rw{font-size:14px}
  .example,.fchip{font-size:14px}
  .chip{font-size:12.5px}
  .mcard .mn{font-size:17.5px}
  .mcard .mdesc{font-size:15px}
  .mrow{font-size:14.5px}
  .msrc,.mnote,.why,.whynot{font-size:14px}
  .mperson-name{font-size:15px}
  .mperson-meta,.mperson-links{font-size:14px}
  .mpeople summary,.mgroup-h .n{font-size:14px}
  .mwhy-h{font-size:14px}
  .bubble.bot .answer,.answer{font-size:16px}
  table.grid{font-size:14.5px}
  table.grid th{font-size:11.5px}
  .pf-k,.pf-history{font-size:14px}
  .prompt-card{font-size:14.5px}
  .filters label,.edit-field>label{font-size:12px}
  .breadcrumb{font-size:13px}
  .ask-form>.btn{font-size:16px;padding:0 30px;min-width:120px}
  .dir-tabs button,.tabs button,.subnav button{font-size:16px;padding-top:12px;padding-bottom:12px}
  @media(max-width:760px){.nav-item{font-size:12px}}
  .load-error{display:grid;gap:8px;justify-items:center;text-align:center}
  .load-error span{color:var(--muted);font-size:13px;max-width:560px}
  /* Filter labels: first letter capital ("Sector", "Category type"); table
     headers: all capitals. Asked for on 2 Nov 2026. */
  .filters label{text-transform:none;letter-spacing:0;font-size:13px}
  table.grid th{text-transform:uppercase}

<body>
<div id="root"></div>
<script type="module">
import React,{useState,useEffect,useRef} from "react";
import {createRoot} from "react-dom/client";
import htm from "htm";
import {marked} from "marked";
import {createReviewPage} from "./review.js?v=20261103j";
import {createDiscoveryPage} from "./discovery.js?v=20261103d";
import {createDateInput, usDate} from "./dates.js?v=20261102d";
import {createDataFeedPage} from "./datafeed.js?v=20261103c";
import {createDashboardPage, DASHBOARD_UNSEEN, NAVIGATE} from "./dashboard.js?v=20261103d";
const html = htm.bind(React.createElement);
const md = (t)=>({dangerouslySetInnerHTML:{__html:marked.parse(t||"")}});
const Review=createReviewPage({html,useState,useEffect,useRef});
const Discovery=createDiscoveryPage({html,useState,useEffect,useRef});
const DataFeed=createDataFeedPage({html,useState,useEffect,Fragment:React.Fragment});
// Dates are typed and shown as MM/DD/YYYY whatever the computer's language.
const DateInput=createDateInput({html,useState,useEffect});
const Dashboard=createDashboardPage({html,useState,useEffect});

/* colour-coded entity chip */
const ETONE={actor:"accent",hub:"teal",event:"violet",uploaded_document:"slate"};
const EChip=({type})=>html`<span class=${"chip "+(ETONE[type]||"slate")}>${(type||"").replace(/_/g," ")}</span>`;

const ICON_SEARCH=html`<svg class="in-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>`;
// Compass's initial, as a person's initials would be (2 Nov 2026).
const AVATAR=html`<span aria-label="Compass">C</span>`;

/* ------------------------------------------------------------------ Ask */
/* Commonly used prompts (Fatima's mockups, 27 Oct 2026). Clicking one fills the
   box and selects the first [bracket], so typing replaces it. */
function fillPrompt(text,setText,ref){
  setText(text);
  setTimeout(()=>{const el=ref.current, at=text.indexOf("[");
    if(!el) return; el.focus();
    if(at>=0) el.setSelectionRange(at,text.indexOf("]",at)+1);},0);
}
function PromptList({prompts,onPick}){
  return html`<div class="prompt-list">
    <h2 class="prompt-h">Commonly used prompts</h2>
    ${prompts.map(x=>html`<button key=${x} type="button" class="prompt-row" onClick=${()=>onPick(x)}>
      <span>${x.split(/(\[[^\]]*\])/).map((part,i)=>part.startsWith("[")?html`<b key=${i}>${part}</b>`:part)}</span>
      <span class="prompt-go" aria-hidden="true">›</span></button>`)}
  </div>`;
}

function Ask({onCarryOver,onExplore}){
  const [q,setQ]=useState("");
  const [carrying,setCarrying]=useState(false);
  const [carryNote,setCarryNote]=useState(null);
  const [busy,setBusy]=useState(false);
  const [turns,setTurns]=useState([]);   // conversation: [{id,q,mode,sql,answer,sources,rewritten,done}]
  const [docId,setDocId]=useState(null);
  const [docName,setDocName]=useState(null);
  const [uploading,setUploading]=useState(false);
  const esRef=useRef(null);
  const fileRef=useRef(null);
  const bottomRef=useRef(null);

  const examples=[
    "Which organizations in our directory work on [topic]?",
    "Which hubs have we mapped for [sector]?",
    "Who in our directory has expertise in [topic]?",
    "Give me a list of people who work on [topic] in [geographic region].",
    "Give me a list of events our team attended in [year].",
  ];
  const boxRef=useRef(null);

  async function onFile(e){
    const f=e.target.files[0]; if(!f) return;
    setUploading(true);
    const fd=new FormData(); fd.append("file",f);
    try{
      const r=await fetch("/api/upload",{method:"POST",body:fd});
      if(!r.ok){ const d=await r.json().catch(()=>({detail:"Upload failed"}));
        alert(d.detail||"Upload failed"); }
      else{ const d=await r.json(); setDocId(d.doc_id); setDocName(d.name); }
    } finally { setUploading(false); if(fileRef.current) fileRef.current.value=""; }
  }
  function clearDoc(){ setDocId(null); setDocName(null); }

  const patchLast=(p)=>setTurns(ts=>{
    if(!ts.length) return ts;
    const c=[...ts]; c[c.length-1]={...c[c.length-1],...p}; return c;});

  function ask(question){
    const text=(question??q).trim();
    if(!text) return;
    if(esRef.current) esRef.current.close();
    // recent completed turns become the conversation memory sent to the server
    const hist=turns.filter(t=>t.done&&t.answer).slice(-3)
      .map(t=>({q:t.q, a:(t.answer||"").slice(0,600)}));
    const id=(crypto.randomUUID&&crypto.randomUUID())||String(Math.random());
    setTurns(ts=>[...ts,{id,q:text,mode:null,sql:null,answer:"",sources:[],rewritten:null,done:false}]);
    setQ(""); setBusy(true);
    const url="/api/ask/stream?question="+encodeURIComponent(text)
      +(docId?("&doc_id="+encodeURIComponent(docId)):"")
      +(hist.length?("&history="+encodeURIComponent(JSON.stringify(hist))):"");
    const es=new EventSource(url); esRef.current=es;
    es.addEventListener("meta",e=>{const d=JSON.parse(e.data);
      patchLast({mode:d.mode, sql:d.sql||null, sources:d.sources||[], rewritten:d.rewritten||null});});
    es.addEventListener("delta",e=>{const d=JSON.parse(e.data);
      setTurns(ts=>{const c=[...ts]; const l=c[c.length-1];
        c[c.length-1]={...l, answer:(l.answer||"")+(d.text||"")}; return c;});});
    es.addEventListener("done",()=>{ patchLast({done:true}); setBusy(false); es.close(); });
    es.onerror=()=>{ setBusy(false); es.close();
      setTurns(ts=>{const c=[...ts]; const l=c[c.length-1];
        if(l) c[c.length-1]={...l, done:true,
          answer:l.answer||"Something went wrong reaching the server."}; return c;});};
  }
  function newConversation(){ if(esRef.current)esRef.current.close(); setTurns([]); setBusy(false); setQ(""); }

  // Carries the WHOLE conversation, not a recent window: a constraint set at
  // turn two and never repeated still counts. Nothing is spent on the map here —
  // the user sends it themselves on the next page.
  async function carryOver(){
    if(carrying||busy) return;
    setCarrying(true); setCarryNote(null);
    const history=turns.filter(t=>t.done).map(t=>({q:t.q,a:(t.answer||"").slice(0,1200),
      sources:(t.sources||[]).map(s=>s.name).filter(Boolean)}));
    try{
      const r=await fetch("/api/ask/handoff",{method:"POST",
        headers:{"Content-Type":"application/json"},body:JSON.stringify({history})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.detail||"Could not read the conversation.");
      if(!d.in_scope||!d.topic) setCarryNote(d.reason||"Build a Map researches organizations, people and events.");
      else onCarryOver({...d,docId,docName});
    }catch(e){ setCarryNote(e.message); }
    setCarrying(false);
  }
  useEffect(()=>()=>esRef.current&&esRef.current.close(),[]);
  useEffect(()=>{ if(bottomRef.current) bottomRef.current.scrollIntoView({block:"end",behavior:"smooth"}); },[turns.length]);

  const fromDocument=s=>s.entity_type==="uploaded_document";
  const sourceOrigin=s=> s.parked
    ? html`<span class="chip violet" title=${"From the saved map: "+(s.map||"untitled")}>Parked — not verified</span>`
    : fromDocument(s) ? html`<span class="chip slate">Your document</span>`
    : html`<span class="chip teal">Verified database</span>`;
  const sourceSummary=sources=>{
    const parked=sources.filter(s=>s.parked).length, doc=sources.filter(fromDocument).length;
    const db=sources.length-parked-doc;
    return [db&&`${db} from the verified database`, doc&&`${doc} from your document`,
            parked&&`${parked} parked, not verified`].filter(Boolean).join(" · ");
  };
  const modeChip=(m,sources)=> m==="sql"
    ? html`<span class="chip accent">⚡ Exact · verified database</span>`
    : m==="doc" ? html`<span class="chip accent">📎 Your document + verified database · cited</span>`
    : m==="semantic" ? html`<span class="chip accent">◎ Verified database search${(sources||[]).some(s=>s.parked)?" + parked organizations":""} · cited</span>` : null;

  const empty=turns.length===0;
  return html`
  <div>
    ${empty
      ? html`<div class="start">
          <h1 class="hero-h">What would you like to know?</h1>
          <form class="start-card" onSubmit=${e=>{e.preventDefault();ask();}}>
            <textarea ref=${boxRef} class="field start-box" rows="4" placeholder="Ask about organizations, hubs, people, or events…"
              value=${q} onInput=${e=>setQ(e.target.value)}
              onKeyDown=${e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask();}}}></textarea>
            <div class="start-actions">
              ${docName
                ? html`<span class="attach-chip">📎 ${docName}
                    <button class="linkbtn" type="button" onClick=${clearDoc}>Remove</button></span>`
                : html`<label class="attach-btn">${uploading?html`<span class="spin"></span> Indexing…`:"📎 Attach a document"}
                    <input type="file" accept=".pdf,.txt,.md" style=${{display:"none"}} onChange=${onFile}/></label>`}
              <button class="btn" disabled=${busy||!q.trim()}>Ask Compass</button>
            </div>
          </form>
          <p class="start-note">ⓘ Answers use information already saved in Compass. To search external
            sources, go to <button class="linkbtn" type="button" onClick=${onExplore}>Explore and Map</button>.</p>
          <${PromptList} prompts=${examples} onPick=${x=>fillPrompt(x,setQ,boxRef)}/>
        </div>`
      : html`
        <div class="conv-head"><span class="chip accent">💬 Conversation</span>
          <button class="newconv" type="button" onClick=${newConversation}>＋ New conversation</button></div>
        <div class="chat">
          ${turns.map((t,i)=>{
            const streaming=(i===turns.length-1)&&busy;
            return html`
            <div class="msg user" key=${t.id+"q"}><div class="bubble user">${t.q}</div></div>
            <div class="msg bot" key=${t.id+"a"}>
              <div class="avatar">${AVATAR}</div>
              <div class="bubble bot">
                <div style=${{display:"flex",gap:"10px",alignItems:"center",marginBottom:"10px"}}>
                  ${modeChip(t.mode,t.sources)}
                  ${streaming&&!t.answer&&html`<span class="chip"><span class="spin"></span> thinking…</span>`}
                </div>
                ${t.rewritten&&html`<div class="rw">Interpreted as: <b>${t.rewritten}</b></div>`}
                <div class="answer" ...${md(t.answer)}></div>
                ${!t.done&&t.answer&&html`<span class="cursor"></span>`}
                ${t.sql&&html`<div class="hint" style=${{marginTop:"18px",borderTop:"1px solid var(--line)",paddingTop:"14px"}}>Source — verified database</div>`}
                ${t.sources.length>0&&html`
                  <details class="sources">
                    <summary>Sources — ${sourceSummary(t.sources)}</summary>
                    ${t.sources.map((s,j)=>html`<div class="src" key=${j}>
                      <div class="nm">${j+1}. ${s.name} <${EChip} type=${s.entity_type}/>
                        ${sourceOrigin(s)}</div>
                      <div class="pv">${s.preview}</div></div>`)}
                  </details>`}
              </div>
            </div>`;
          })}
          ${!busy&&html`<div class="carry-row">
            <button class="newconv" type="button" disabled=${carrying} onClick=${carryOver}>
              ${carrying?html`<span class="spin"></span> Reading the conversation…`:"⊕ Research this on the web"}</button>
            ${carryNote&&html`<div class="hint">${carryNote}</div>`}
          </div>`}
          <div ref=${bottomRef}></div>
        </div>`}

    ${!empty&&html`<div class="composer">
      <div class="attach-row" style=${{marginTop:0,marginBottom:"10px"}}>
        ${docName
          ? html`<span class="chip accent">📎 ${docName}</span>
              <button class="example" type="button" onClick=${clearDoc}>Remove</button>
              <span class="hint" style=${{margin:0}}>Answers draw on this document
                <b>and</b> the database.</span>`
          : html`<label class="example" style=${{display:"inline-flex",gap:"7px",alignItems:"center"}}>
              ${uploading
                ? html`<span class="spin"></span> Indexing…`
                : "📎 Attach a document (PDF, .txt, .md)"}
              <input ref=${fileRef} type="file" accept=".pdf,.txt,.md"
                style=${{display:"none"}} onChange=${onFile}/>
            </label>`}
      </div>
      <form class="ask-form" onSubmit=${e=>{e.preventDefault();ask();}}>
        <div class="input-shell">
          ${ICON_SEARCH}
          <textarea class="field" rows="1"
            placeholder=${empty?"Ask about organizations, hubs, or events…":"Ask a follow-up…"}
            value=${q} onInput=${e=>setQ(e.target.value)}
            onKeyDown=${e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask();}}}></textarea>
        </div>
        <button class="btn" disabled=${busy}>${busy?html`<span class="spin"></span>`:"Ask Compass"}</button>
      </form>
    </div>`}
  </div>`;
}

/* --------------------------------------------------------------- Browse */
// A failed request comes back as {__error}, never as data: on 2026-11-03 a 500 from
// /api/browse/actors was read as a list, "data.actors.filter" threw, and since every
// page stays mounted, the whole app went blank.
const api = (p)=>fetch(p).then(async r=>{
  const body=await r.json().catch(()=>({}));
  return r.ok?body:{__error:body.detail||`The server answered ${r.status}.`};
}).catch(()=>({__error:"The server could not be reached."}));
function LoadError({message}){
  return html`<div class="empty load-error" role="alert"><b>This list could not be loaded.</b>
    <span>${message}</span><button class="btn ghost" onClick=${()=>location.reload()}>Try again</button></div>`;
}
/* One page failing never takes the others (or the sidebar) down with it: each
   page is drawn inside its own boundary. */
class PageBoundary extends React.Component{
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(error){return {error};}
  componentDidCatch(error){console.error(`${this.props.name} failed:`,error);}
  render(){
    if(!this.state.error) return this.props.children;
    return html`<div class="empty load-error" role="alert"><b>${this.props.name} could not be shown.</b>
      <span>${String(this.state.error?.message||this.state.error)}</span>
      <button class="btn ghost" onClick=${()=>this.setState({error:null})}>Try again</button></div>`;
  }
}
const dash = (v)=> (v===null||v===undefined||v==="") ? html`<span class="dash">—</span>` : v;

function useOnce(fn,dep){ const[d,setD]=useState(null);
  useEffect(()=>{let ok=true;fn().then(x=>ok&&setD(x));return()=>{ok=false}},dep||[]);return d; }

/* ------------------------------------------------- Ecosystem directory (Browse)
   One design for every tab (asked for on 28 Oct 2026): a keyword box, a row of
   filters with Status and Owner, a table whose names carry a status and a source
   badge, a count with Export, and a detail page whose Edit form shows every field
   in one column, in groups. Owner reads "Not recorded" until logins exist. */
const OWNER_NONE="Not recorded";
const ownerOf=r=>r.owner||OWNER_NONE;
// Pending review = still waiting for a decision; Parked = a person clicked Park.
function statusOf(r){
  const s=String(r.status||r.verification_status||"").toLowerCase();
  if(s==="verified"||s==="phase_1") return "Verified";
  if(s==="parked") return "Parked";
  if(s==="rejected") return "Rejected";
  if(s==="removed") return "Deleted";
  return "Pending review";
}
// One look for every record tag (30 Oct 2026): Verified alone has a check mark;
// every other tag is a colored dot and the word.
const STATUS_CHIP={"Verified":"green","Pending review":"amber","Parked":"orange","Rejected":"slate","Deleted":"red"};

/* Delete in the Ecosystem Directory (30 Oct 2026): one confirmation, no reason
   to type, no restore. The backend still records the GHUS decision (with a fixed
   reason) and the directory hides the record. Organizations only for now. */
const DELETE_REASON="Deleted from the Ecosystem Directory";
function DeletePanel({kind,r,onDone,onClose}){
  const works=kind==="actor";
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState(null);
  async function send(){
    if(busy||!works) return;
    setBusy(true); setErr(null);
    try{
      const res=await fetch(`/api/browse/actors/${r.id}/remove`,{method:"POST",
        headers:{"Content-Type":"application/json"},body:JSON.stringify({reason:DELETE_REASON,confirm:true})});
      const d=await res.json();
      if(!res.ok) throw new Error((d.detail&&d.detail.message)||d.detail||"Could not delete that.");
      onDone(`${r.name} was deleted from the directory.`);
    }catch(e){ setErr(String(e.message||e)); setBusy(false); }
  }
  return html`<div class="card pad fade delete-panel" role="alertdialog" aria-label=${`Delete ${r.name}`}>
    <p class="delete-warning" style=${{marginTop:0}}>Are you sure you want to delete ${r.name}?</p>
    <p class="hint" style=${{margin:"0 0 10px"}}>Clicking Yes removes it from the Ecosystem Directory for everyone.</p>
    ${!works&&html`<p class="hint">Deleting ${kind==="event"?"events":kind==="hub"?"hubs":"people"} connects once the
      backend has the same path; organizations can be deleted now.</p>`}
    ${err&&html`<div class="whynot" role="alert">${err}</div>`}
    <div class="attach-row">
      <button class="btn danger" type="button" disabled=${busy||!works} onClick=${send}>${busy?"Deleting…":"Yes, I'm sure"}</button>
      <button class="example" type="button" disabled=${busy} onClick=${onClose}>No, keep</button>
    </div>
  </div>`;
}
function RecordBadges({r}){
  const status=statusOf(r), origin=r.origin==="AI-Mapped"?"AI mapped":r.origin;
  return html`<span class="badges inline">
    ${origin&&html`<span class=${"chip dot "+(origin==="AI mapped"?"violet":"slate")} title="Who made this record">${origin}</span>`}
    <span class=${"chip "+STATUS_CHIP[status]+(status==="Verified"?"":" dot")}>${status==="Verified"?"✓ ":""}${status}</span>

const today=()=>new Date().toISOString().slice(0,10);
const shortType=t=>String(t||"").split("/")[0].trim();
const plusMore=xs=>!xs||!xs.length?"":xs[0]+(xs.length>1?" +"+(xs.length-1):"");
const distinct=xs=>[...new Set(xs.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b)));

function downloadCsv(name,columns,rows){
  const cell=v=>{const t=String(v??"");return /[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;};
  const text=[columns.map(c=>cell(c.label)),...rows.map(r=>columns.map(c=>cell(c.text(r))))]
    .map(line=>line.join(",")).join("\n");
  const url=URL.createObjectURL(new Blob(["﻿"+text],{type:"text/csv"}));
  const a=document.createElement("a"); a.href=url; a.download=name+".csv";
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

/* The list every tab shares. `filters` are {key,label,options,test} (a select) or
   {key,label,kind:"text",placeholder,test}; `more` folds the rarely used ones.
   Status and Owner are added to every tab. `columns` are {label,text,cell?}. */
/* Status (a person's decision) and Source (who made the record) are separate
   filters; Owner applies to All Records only. A country outside the US has no
   state, GHUS region or hub, so those filters and columns step aside (2 Nov 2026). */
const sourceOf=r=>r.origin==="AI-Mapped"?"AI mapped":(r.origin||"");
const US="United States";
function Directory({noun,plural,nameLabel="Name",rows,search,filters,more=[],columns,onOpen,exportName,empty,note}){
  const [q,setQ]=useState("");
  const [vals,setVals]=useState({});
  const [mine,setMine]=useState(false);
  const set=(k,v)=>setVals(x=>({...x,[k]:v}));
  const nonUS=!!vals.country&&vals.country!==US;
  const common=[
    {key:"_status",label:"Status",options:distinct(rows.map(statusOf)).filter(v=>v!=="Deleted"),test:(r,v)=>statusOf(r)===v},
    {key:"_source",label:"Source",options:distinct(rows.map(sourceOf)),test:(r,v)=>sourceOf(r)===v},
    ...(mine?[]:[{key:"_owner",label:"Owner",options:distinct(rows.map(ownerOf)),test:(r,v)=>ownerOf(r)===v}]),
  ];
  const usable=f=>!(nonUS&&f.usOnly);
  filters=filters.filter(usable); more=more.filter(usable); columns=columns.filter(usable);
  const all=[...filters,...common,...more];
  const needle=q.trim().toLowerCase();
  const matches=rows.filter(r=>
    statusOf(r)!=="Deleted" &&
    (!needle||search.text(r).toLowerCase().includes(needle)) &&
    all.every(f=>!vals[f.key]||f.test(r,vals[f.key])));
  const control=f=>html`<div key=${f.key}><label>${f.label}</label>
    ${f.kind==="text"
      ? html`<input class="field" placeholder=${f.placeholder||""} value=${vals[f.key]||""}
          onInput=${e=>set(f.key,e.target.value)}/>`
      : f.kind==="date"
      ? html`<${DateInput} ariaLabel=${f.label} value=${vals[f.key]||""} onChange=${v=>set(f.key,v)}/>`
      : html`<${Sel} v=${vals[f.key]||""} set=${v=>set(f.key,v)} opts=${typeof f.options==="function"?f.options(vals):f.options}/>`}</div>`;
  // Export = what the table shows: the name, its two tags, then the columns.
  const exportColumns=[{label:nameLabel,text:r=>r.name},{label:"Source",text:sourceOf},
    {label:"Status",text:statusOf},...columns];
  return html`<div class="fade">
    <div class="card pad">
      <div class="dir-top">
        <div class="seg" role="group" aria-label="Whose records">
          <button type="button" class=${mine?"":"on"} onClick=${()=>setMine(false)}>All Records</button>
          <button type="button" class=${mine?"on":""} disabled title="Available once logins exist"
            onClick=${()=>{setMine(true);set("_owner","");}}>My Records</button>
        </div>
        <input class="field" placeholder=${search.placeholder} aria-label="Search"
          value=${q} onInput=${e=>setQ(e.target.value)}/>
      </div>
      <div class="filters">${[...filters,...common].map(control)}</div>
      <div class="dir-row">
        ${more.length>0&&html`<details class="more-filters"><summary>More filters</summary>
          <div class="filters" style=${{marginTop:"12px"}}>${more.map(control)}</div></details>`}
      </div>
      ${note&&html`<div class="hint" style=${{marginTop:"10px"}}>${note}</div>`}
    </div>
    <div class="card dir-results" style=${{overflow:"hidden"}}>
      <div class="dir-count">
        <span>${matches.length} ${matches.length===1?noun:plural} shown</span>
        <button class="example" type="button" disabled=${!matches.length}
          onClick=${()=>downloadCsv(exportName,exportColumns,matches)}>⤓ Export</button>
      </div>
    ${!rows.length? html`<div class="empty">${empty}</div>`
      : !matches.length? html`<div class="empty">No ${plural} match these filters. Try widening them.</div>`
      : html`
      <table class="grid"><thead><tr><th>${nameLabel}</th>
        ${columns.map(c=>html`<th key=${c.label} class=${c.num?"num":""}>${c.label}</th>`)}<th aria-hidden="true"></th></tr></thead>
        <tbody>${matches.slice(0,400).map(r=>html`<tr key=${r.id||r.hub_id||r.name} onClick=${()=>onOpen(r)}>
          <td><div class="name-link">${r.name}</div><${RecordBadges} r=${r}/></td>
          ${columns.map(c=>html`<td key=${c.label} class=${c.num?"num":""}>${c.cell?c.cell(r):dash(c.text(r))}</td>`)}
          <td class="row-go" aria-hidden="true">›</td></tr>`)}</tbody>
      </table>
      ${matches.length>400&&html`<div class="tablecap">
        Showing first 400 of ${matches.length}. Narrow the filters to see the rest.</div>`}`}
    </div>
  </div>`;
}

/* A record's page: what we hold, then the Edit form for every field. */
/* A record's profile (29 Oct 2026): one layout for every type. Header with the
   name, a one-line summary and badges; a main column of titled sections, where an
   empty field reads "Not found" (an empty field is itself an answer); a side
   column with the key facts and the sources and history. */
const NOT_FOUND=html`<span class="dash">Not found</span>`;
const isEmpty=v=>v==null||v===""||(Array.isArray(v)&&!v.length);
// Long text keeps its paragraphs and bullet points; a long one opens with Show more.
function RichText({text,limit=420}){
  const [open,setOpen]=useState(false);
  const raw=String(text||"").trim();
  if(!raw) return NOT_FOUND;
  const lines=raw.split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const blocks=[]; let list=[];
  const flush=()=>{ if(list.length){ blocks.push(html`<ul key=${blocks.length}>${list.map((x,i)=>html`<li key=${i}>${x}</li>`)}</ul>`); list=[]; } };
  for(const line of lines){
    const item=line.match(/^(?:[-•*·]|\d+[.)])\s+(.*)$/);
    if(item) list.push(item[1]); else { flush(); blocks.push(html`<p key=${blocks.length}>${line}</p>`); }
  }
  flush();
  if(raw.length<=limit||open) return html`<div class="rich">${blocks}
    ${open&&html`<button class="linkbtn" type="button" onClick=${()=>setOpen(false)}>Show less</button>`}</div>`;
  const cut=raw.slice(0,limit), end=Math.max(cut.lastIndexOf(". "),cut.lastIndexOf("; "));
  return html`<div class="rich"><p>${(end>limit/2?cut.slice(0,end+1):cut+"…")}</p>
    <button class="linkbtn" type="button" onClick=${()=>setOpen(true)}>Show more</button></div>`;
}
// Headings in title case ("Funding and Constraints"), asked for on 2 Nov 2026.
const SMALL_WORDS=new Set(["a","an","and","as","at","by","for","in","of","on","or","the","to","with"]);
const titleCase=t=>String(t).split(" ").map((w,i)=>i&&SMALL_WORDS.has(w.toLowerCase())?w.toLowerCase()
  :/^[a-z]/.test(w)?w[0].toUpperCase()+w.slice(1):w).join(" ");
function Section({title,rows,children}){
  return html`<section class="pf-section"><h3>${titleCase(title)}</h3>
    ${rows&&html`<div class="pf-rows">${rows.map(([k,v])=>html`<${React.Fragment} key=${k}>
      <span class="pf-k">${k}</span><span class="pf-v">${isEmpty(v)?NOT_FOUND:v}</span></${React.Fragment}>`)}</div>`}
    ${children}</section>`;
}
const link=(url,label)=>url?html`<a href=${url} target="_blank" rel="noopener noreferrer">${label||url.replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,"")}</a>`:null;
const FACT_LABELS={description:"description",primary_technical_focus:"technical focus",technical_approach:"approach",
  current_activities:"current activities",technology_ip_notes:"technology and IP",key_constraints:"constraints",
  funding_summary:"funding",primary_lifecycle_role:"lifecycle role"};
const RELATION_LABELS={unit_of:["Unit of","Has unit"],operated_by:["Operated by","Operates"],member_of:["Member of","Has member"],
  portfolio_of:["In the portfolio of","Has in its portfolio"],spinout_of:["Spinout of","Spun out"],funded_by:["Funded by","Funds"],
  collaborates_with:["Collaborates with","Collaborates with"]};

function SourcesHistory({kind,r,profile}){
  const lines=[];
  const origin=r.origin==="AI-Mapped"?"Found by Explore and Map or monitoring":r.origin==="Imported"?"Imported from the Phase 1 map":null;
  if(origin) lines.push(origin);
  // What it was mapped for (2 Nov 2026): the sector and hub it sits in, and the
  // spreadsheet it came from when that is recorded.
  const sheet=profile&&profile.origin_source&&profile.origin_source.type==="spreadsheet"
    ? String(profile.origin_source.description||"").split(/ ingested from /i)[0].trim() : "";
  const mappedFor=[(r.sectors||[]).length?`the ${r.sectors.join(", ")} sector`:"",
    (r.hubs||[]).length?`the ${r.hubs.join(", ")}${/\bhub\b/i.test(r.hubs.join(" "))?"":" hub"}`:""].filter(Boolean).join(", in ");
  if(kind==="actor"&&(mappedFor||sheet)) lines.push(`Mapped for ${mappedFor||"a GHUS spreadsheet"}${sheet?` (${sheet})`:""}`);
  const v=profile&&profile.verification;
  if(v&&v.decision==="verified"&&v.at) lines.push(`Verified ${usDate(v.at.slice(0,10))}${byWhom(v.decided_by)}`);
  if(statusOf(r)==="Deleted"&&r.removed_at) lines.push(`Deleted ${usDate(r.removed_at.slice(0,10))}${byWhom(r.removed_by)}: ${r.removed_reason||""}`);
  if(kind==="hub"&&r.approved_at) lines.push(`Approved ${usDate(String(r.approved_at).slice(0,10))}${byWhom(r.approved_by)}`);
  const sources=(profile&&profile.sources)||[];
  return html`<div class="pf-side-box"><h3>Sources and History</h3>
    ${kind==="actor"&&!profile?html`<div class="hint" style=${{margin:0}}><span class="spin"></span> Loading…</div>`:null}
    ${sources.map(s=>html`<div class="pf-source" key=${s.url}>${link(s.url)}
      ${(s.supports||[]).some(k=>FACT_LABELS[k])&&html`<div class="hint" style=${{margin:0}}>${s.supports.filter(k=>FACT_LABELS[k]).map(k=>FACT_LABELS[k]).join(", ")}</div>`}</div>`)}
    ${kind!=="actor"&&r.website&&html`<div class="pf-source">${link(r.website)}</div>`}
    ${kind==="actor"&&profile&&!sources.length&&html`<div class="dash">No source pages recorded</div>`}
    ${lines.map(l=>html`<div class="pf-history" key=${l}>${l}</div>`)}
  </div>`;
}

function RecordPage({kind,r,onBack,onChanged,subtitle,sections,glance=[],children,options}){

  const removed=statusOf(r)==="Deleted";
  useEffect(()=>{ if(kind!=="actor") return; let live=true;
    api(`/api/browse/actors/${r.id}/profile`).then(d=>live&&setProfile(d)).catch(()=>live&&setProfile({sources:[],events:[],relationships:[]}));
    return ()=>{live=false;}; },[r.id]);
  const body=typeof sections==="function"?sections(profile):(sections||[]);
  return html`<div class="card pad detail fade">
    <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <button class="backlink" onClick=${onBack}>← Back to results</button>
      <span style=${{display:"inline-flex",gap:"8px"}}>

const RECORD_STATUSES=["verified","pending review","parked","rejected"];
const FREQUENCIES=["One-time","Annual","Every two years","Twice a year","Quarterly","Monthly","Irregular","Not found"];
// [field, label, type, options-key]. Types: text, long, date, select, readonly.
const EDIT_GROUPS={

const asText=v=>Array.isArray(v)?v.join(", "):(v??"");
function RecordEditor({kind,record,options,onClose}){
  const fields=EDIT_GROUPS[kind].flatMap(([,fs])=>fs);
  const choices={...options,frequencies:FREQUENCIES};
  const initial=()=>Object.fromEntries(fields.map(([k])=>[k,String(asText(record[k]))]));
  const firstStatus=()=>statusOf(record).toLowerCase();
  const [draft,setDraft]=useState(initial);
  const [status,setStatus]=useState(firstStatus);
  const [notes,setNotes]=useState(record.ghus_notes||"");
  const [attended,setAttended]=useState(!!record.attended);
  const set=(k,v)=>setDraft(d=>({...d,[k]:v}));

      rows=${Math.min(10,Math.max(2,Math.ceil((draft[k]||"").length/90)))}

    if(type==="date") return html`<${DateInput} ariaLabel=${label} value=${(draft[k]||"").slice(0,10)} onChange=${v=>set(k,v)}/>`;
    if(type==="select"){
      const list=choices[opts]||[];
      return html`<select class="field" aria-label=${label} value=${draft[k]} onChange=${e=>set(k,e.target.value)}>
        ${!list.includes(draft[k])&&html`<option value=${draft[k]}>${draft[k]||"Not recorded"}</option>`}
        ${list.map(o=>html`<option key=${o} value=${o}>${o}</option>`)}</select>`;
    }
    return html`<input class="field" type="text" aria-label=${label} value=${draft[k]} onInput=${e=>set(k,e.target.value)}/>`;
  };
  return html`<div class="card pad fade edit-form">
    <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <strong>Edit ${kind==="actor"?"organization":kind}</strong>
      <button class="example" type="button" onClick=${onClose}>Close</button>
    </div>
    ${EDIT_GROUPS[kind].map(([group,fs])=>html`<div class="edit-group" key=${group}>
      <div class="edit-h">${group}${fs.every(([,,t])=>t==="readonly")?html` <span class="hint" style=${{margin:0}}>read only</span>`:""}</div>
      ${fs.map(f=>html`<div class="edit-field" key=${f[0]}><label>${f[1]}</label>${input(f)}</div>`)}
    </div>`)}

      <div class="edit-h">Review</div>

          ${RECORD_STATUSES.map(v=>html`<option key=${v} value=${v}>${v[0].toUpperCase()+v.slice(1)}</option>`)}
        </select></div>
      <div class="edit-field"><label>Source</label><div class="edit-ro">${record.origin||html`<span class="dash">—</span>`}</div></div>
      <div class="edit-field"><label>Owner</label><div class="edit-ro">${ownerOf(record)}</div></div>
      ${kind==="event"&&html`<div class="edit-field"><label>Attended</label>
        <label class="check"><input type="checkbox" checked=${attended} onChange=${e=>setAttended(e.target.checked)}/>
          GHUS attended this event</label></div>`}
      <div class="edit-field"><label>GHUS Notes</label>
        <textarea class="field edit-long" rows="4" value=${notes} onInput=${e=>setNotes(e.target.value)}
          placeholder=${kind==="event"
            ?"Who attended, what was worth it, whether to go next year. Link to the back-to-office report (OneDrive)."
            :"Context only GHUS has: meetings, contacts, past collaboration. Links to reports (OneDrive)."}></textarea></div>
    </div>
    <div class="attach-row" style=${{marginTop:"12px"}}>
      <button class="btn" type="button" disabled=${true} title="Saving is not connected yet">Save</button>
      <button class="example" type="button" onClick=${()=>{setDraft(initial());setNotes(record.ghus_notes||"");
        setAttended(!!record.attended);setStatus(firstStatus());}}>Reset</button>
      <span class="hint" style=${{margin:0}}>Saving isn't connected yet: edits here are not stored.</span>
    </div>
  </div>`;
}

// The Dashboard opens one record: select it once the list has loaded.
function useFocus(focus,rows,setSel){
  useEffect(()=>{if(!focus||!rows) return;
    const row=rows.find(r=>String(r.id)===String(focus.id)); if(row) setSel(row);},[focus,rows]);
}

function Actors({focus}){
  const [version,setVersion]=useState(0);

function eventOrder(e){
  const d=(e.end_date||e.start_date||"").slice(0,10), t=today();
  if(!e.start_date) return [1,""];
  return d>=t?[0,e.start_date]:[2,String(99999999-+e.start_date.slice(0,10).replace(/-/g,""))];
}

};
// Short list values read better capitalized ("conference" -> "Conference").
const CAPITALIZED=new Set(["event_type","date_status","event_format","recurring_pattern","sector"]);
const capFirst=v=>typeof v==="string"&&v?v.charAt(0).toUpperCase()+v.slice(1):v;
// An edition's dates as src/map_agent/event_dates.py dates_text writes them:
// "11/16/2026", "11/16/2026 – 11/19/2026", "02/2026", "2026 (exact date not found)".
const eventDates=(start,end)=>{
  const s=String(start||"").trim(), e=String(end||"").trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)){
    const first=s.slice(0,10), last=/^\d{4}-\d{2}-\d{2}/.test(e)?e.slice(0,10):"";
    return last&&last>first?`${usDate(first)} – ${usDate(last)}`:usDate(first);
  }
  const month=s.match(/^(\d{4})-(\d{2})$/);
  if(month) return `${month[2]}/${month[1]}`;
  if(/^\d{4}$/.test(s)) return `${s} (exact date not found)`;
  return s;
};

/* one result card: fields, sources (struck through when dead), judge verdict */
/* Regional hub labels are derived locally, without research or database writes. */
function hubLocationKey(value){
  return String(value||"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
}
function hubCountryKey(value){
  const key=hubLocationKey(value);
  return ["us","usa","u s","u s a","united states","united states of america"].includes(key)?"us":key;
}
function hubStateKey(value){
  const names="Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|District of Columbia|Florida|Georgia|Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland|Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New Hampshire|New Jersey|New Mexico|New York|North Carolina|North Dakota|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode Island|South Carolina|South Dakota|Tennessee|Texas|Utah|Vermont|Virginia|Washington|West Virginia|Wisconsin|Wyoming".split("|");
  const codes="AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY".split(" ");
  const key=hubLocationKey(value), index=names.findIndex(name=>hubLocationKey(name)===key);
  return index<0?key:codes[index].toLowerCase();
}
// GHUS Architecture V2 September: seven fixed regions, separate from hubs.
const US_REGIONS = {
  Northeast: "CT ME MA NH NY RI VT".split(" "),
  "Mid-Atlantic": "DE MD NJ PA VA WV DC".split(" "),
  Southeast: "AL FL GA KY MS NC SC TN".split(" "),
  "Midwest / Great Lakes": "IL IN IA KS MI MN MO NE ND OH SD WI".split(" "),
  "South Central / Texas Gulf": "AR LA OK TX".split(" "),
  "Mountain West / Rocky Mountain": "AZ CO ID MT NV NM UT WY".split(" "),
  "West Coast / Pacific": "AK CA HI OR WA".split(" ")
};
// Full state names and the GHUS region for a state, for directory filters.
const STATE_NAMES="Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|District of Columbia|Florida|Georgia|Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland|Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New Hampshire|New Jersey|New Mexico|New York|North Carolina|North Dakota|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode Island|South Carolina|South Dakota|Tennessee|Texas|Utah|Vermont|Virginia|Washington|West Virginia|Wisconsin|Wyoming".split("|");
const STATE_CODES="AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY".split(" ");
function stateName(value){
  let t=String(value||"").replace(/\./g,"").trim();
  if(/^(washington )?dc$/i.test(t)) t="DC";
  if(/^new york city$/i.test(t)) t="New York";
  const i=/^[A-Za-z]{2}$/.test(t)?STATE_CODES.indexOf(t.toUpperCase()):STATE_NAMES.findIndex(n=>n.toLowerCase()===t.toLowerCase());
  return i<0?null:STATE_NAMES[i];
}
function regionOfState(name){
  const code=STATE_CODES[STATE_NAMES.indexOf(name)];
  return code?Object.keys(US_REGIONS).find(r=>US_REGIONS[r].includes(code))||null:null;
}
// The state named in a free-text location ("UN Headquarters, New York, NY"), read
// from the end; null when none is named (e.g. "Geneva, Switzerland").
function stateInText(text){
  const parts=String(text||"").split(/,|—|–/).map(x=>x.trim()).filter(Boolean).reverse();
  for(const part of parts){ const n=stateName(part.replace(/\s+\d{5}(-\d{4})?$/,"")); if(n) return n; }
  return null;
}
function regionalHub(actor){
  const country=hubCountryKey(actor.country);
  let state=hubStateKey(actor.state);
  if(["d c","washington dc","washington d c"].includes(state))state="dc";
  const city=String(actor.location_city||actor.city||"").trim();
  if(!country)return {region:null,status:"Needs review",reason:"Confirm the country before assigning a US region."};
  if(country!=="us")return {region:null,status:"Outside US regions",reason:"The GHUS seven-region convention applies only to US locations."};

const LISTED_FACT=/^(land.grant|relevant cent|program|key program|operator|type|.*\btype$|recent project|projects?$|main funders?|funders?|sponsor|formal designation|facility|what it tests|current project|clinical|academic link|scale|initiative|size|company size|products?|key products?|relevant products?|segment|operating location|current activity|technology|problem|found|stage|trl|funding stage|pilot|customer|offerings?|headquarters|fund size|thesis|jurisdiction|parent|mandate|funding programs?|mission|geography|grant themes?|member|documented members|institution type|governance)/i;

const plainWords=t=>String(t||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();

const restates=(value,names)=>{const v=plainWords(value);

     && !/\b(lab|laboratory|laboratories|department|center|centre|school of)\b/i.test(actor.name||"")
