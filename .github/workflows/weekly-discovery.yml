name: Weekly Discovery

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      live:
        description: "Run with --live and write to the configured database"
        required: false
        default: false
        type: boolean

jobs:
  weekly-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GHUS_AGENT_CONTACT_EMAIL: ${{ secrets.GHUS_AGENT_CONTACT_EMAIL }}
      LIVE_INPUT: ${{ github.event.inputs.live || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -c "import sqlalchemy, sklearn, joblib, httpx, yaml; print('deps ok')"

      - name: Validate required environment
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in DATABASE_URL ANTHROPIC_API_KEY GHUS_AGENT_CONTACT_EMAIL; do
            if ! value="$(printenv "$name")" || [ -z "$value" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required environment variable(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Validate discovery config
        run: |
          python - <<'PY'
          from agents.discovery.run import load_config

          config = load_config()
          required = {"climate_week", "unga_programme", "unga_guide"}
          missing = required.difference(config.get("sources", {}))
          if missing:
              raise SystemExit(f"missing discovery source config: {sorted(missing)}")
          PY

      - name: Run weekly discovery
        shell: bash
        run: |
          set -u
          mkdir -p agents/runs
          LIVE_ARG=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$LIVE_INPUT" = "true" ]; then
            LIVE_ARG="--live"
          fi
          RUN_EXIT=0
          SUCCEEDED=()
          FAILED=()
          for SOURCE in climate_week unga_programme unga_guide; do
            set +e
            python -m agents.discovery.run \
              --source "$SOURCE" \
              --entity event \
              $LIVE_ARG \
              --out "agents/runs/${SOURCE}-audit.csv" \
              --digest-out "agents/runs/${SOURCE}-digest.md"
            SOURCE_EXIT=$?
            set -e
            if [ -f "agents/runs/${SOURCE}-digest.md" ] && grep -qi "status.*failed" "agents/runs/${SOURCE}-digest.md"; then
              SOURCE_EXIT=1
            fi
            if [ "$SOURCE_EXIT" -eq 0 ]; then
              SUCCEEDED+=("$SOURCE")
            else
              FAILED+=("${SOURCE}(exit=${SOURCE_EXIT})")
              RUN_EXIT=1
            fi
          done

          {
            echo "### Weekly discovery source outcomes"
            echo
            echo "Succeeded: ${SUCCEEDED[*]:-none}"
            echo "Failed: ${FAILED[*]:-none}"
          } | tee agents/runs/source-outcomes.md
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat agents/runs/source-outcomes.md >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$RUN_EXIT" -ne 0 ]; then
            exit "$RUN_EXIT"
          fi
          python -m agents.enrichment.run \
            --entity actor \
            --field-set profile \
            --limit 50 \
            --deterministic-only \
            --revisit-missing \
            $LIVE_ARG
          python -m agents.index.refresh \
            --entity all \
            --limit 500 \
            $LIVE_ARG

      - name: Upload weekly discovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-discovery-artifacts
          path: |
            agents/runs/*-audit.csv
            agents/runs/*-digest.md
            agents/runs/source-outcomes.md
          if-no-files-found: warn
