name: Weekly Discovery

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      live:
        description: "Run with --live and write to the configured database"
        required: false
        default: false
        type: boolean

jobs:
  weekly-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GHUS_AGENT_CONTACT_EMAIL: ${{ secrets.GHUS_AGENT_CONTACT_EMAIL }}
      LIVE_INPUT: ${{ github.event.inputs.live || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -c "import sqlalchemy, sklearn, joblib, httpx, yaml, anthropic; print('deps ok')"

      - name: Validate Anthropic SDK compatibility
        run: |
          python -m pytest -q tests/agent/test_agents_common_llm.py

      - name: Validate required environment
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in DATABASE_URL ANTHROPIC_API_KEY GHUS_AGENT_CONTACT_EMAIL; do
            if ! value="$(printenv "$name")" || [ -z "$value" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required environment variable(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Validate discovery config
        run: |
          python - <<'PY'
          from agents.discovery.run import load_config

          config = load_config()
          required = {"climate_week", "unga_programme", "unga_guide"}
          missing = required.difference(config.get("sources", {}))
          if missing:
              raise SystemExit(f"missing discovery source config: {sorted(missing)}")
          PY

      - name: Run weekly discovery
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$LIVE_INPUT" = "true" ]; then
            python -m agents.weekly_discovery --live
            else
            python -m agents.weekly_discovery
          fi

      - name: Upload weekly discovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-discovery-artifacts
          path: |
            agents/runs/*-audit.csv
            agents/runs/*-digest.md
            agents/runs/open-web-*-report.md
            agents/runs/open-web-*-audit.csv
            agents/runs/source-outcomes.md
          if-no-files-found: warn
